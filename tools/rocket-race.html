<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Race Name Picker — Pick &amp; Race</title>
<meta name="description" content="Type or paste a class list, pick a race length, and let rockets decide who goes first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel {
    border: var(--border); border-radius: var(--radius); background: var(--paper);
    padding: 20px; position: sticky; top: 20px;
  }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  textarea {
    width: 100%; min-height: 140px; border: var(--border); border-radius: 8px;
    padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  input[type="range"] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.88rem; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .duration-val { font-family: var(--font-display); font-weight: 700; }

  .stage {
    border: var(--border); border-radius: var(--radius);
    background: radial-gradient(circle at 80% 20%, #1c2a4d, #0c1226 70%);
    padding: 16px;
    min-height: 420px;
    position: relative; overflow: hidden;
  }
  .stage .lane-name { color: #eef1fb; }
  .stage.projector { background: #050812; }
  .stage.projector .lane-name { color: #fff; }
  .track { background: rgba(255,255,255,0.08) !important; }
  .stage.projector .track { background: rgba(255,255,255,0.06) !important; }
  .track .finish-mark { background: rgba(239,185,60,0.6) !important; }
  .stage.finished-glow { box-shadow: 0 0 0 4px #fff, 0 0 50px rgba(255,255,255,0.6) inset; }

  .starfield { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

  .stage-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; position: relative; z-index: 5; }
  .stage-header .status { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
  .stage.projector .stage-header .status { color: #fff; }
  .stage-header .clock { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .stage.projector .stage-header .clock { color: var(--pencil); }

  .track-area { max-height: 62vh; overflow-y: auto; padding-right: 4px; position: relative; z-index: 5; }
  .lane { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin-bottom: 8px; transition: transform 0.15s ease; }
  .lane.leader { transform: scale(1.015); }
  .lane-name { font-size: 0.85rem; font-weight: 600; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s ease; }
  .lane.leader .lane-name { color: var(--pencil); }
  .track { position: relative; height: 30px; background: #d3e6d9; border-radius: 999px; overflow: hidden; }
  .track .finish-mark { position: absolute; right: 6px; top: 0; bottom: 0; width: 2px; background: rgba(30,42,69,0.4); }
  .duck-token {
    position: absolute; top: 2px; left: 0; width: 26px; height: 26px;
    will-change: left;
  }
  .duck-token svg { width: 100%; height: 100%; }
  .duck-token::before {
    content: ""; position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
    width: 34px; height: 6px;
    background: linear-gradient(90deg, transparent, rgba(239,185,60,0.85));
    border-radius: 4px;
    transition: width 0.1s ease, opacity 0.1s ease;
  }
  .duck-token.surging::before { width: 54px; opacity: 1; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95)); }

  .many-names .lane { grid-template-columns: 84px 1fr; }
  .many-names .track { height: 22px; }
  .many-names .duck-token { width: 18px; height: 18px; }

  .winner-banner {
    margin-top: 14px; border: var(--border); border-radius: var(--radius);
    background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display);
    font-size: 1.15rem; display: none;
    animation: winnerPop 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes winnerPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .winner-banner.show { display: block; }

  .history { margin-top: 16px; font-size: 0.82rem; color: var(--ink-soft); }
  .history .chip { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 0 0; }

  @media (max-width: 860px) {
    .tool-wrap { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
  @media (prefers-reduced-motion: reduce) {
    .duck-token, .duck-token svg, .lane, .star { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="balloon-pop.html">Balloon Pop</a>
      <a href="ball-drop.html">Ball Drop</a>
      <a href="slot-machine.html">Slot Machine</a>
      <a href="spinning-wheel.html">Wheel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Rocket Race Name Picker</h1>
  <p>Paste your roster, set a race length, and let the rockets pick. Works for 2 names or 40.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo
Yuki
Isla</textarea>

      <label for="duration">Race length: <span class="duration-val" id="durationVal">8s</span></label>
      <input type="range" id="duration" min="2" max="30" value="8">

      <div class="toggle-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat" style="margin:0;">No repeats until everyone's had a turn</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="projector">
        <label for="projector" style="margin:0;">Projector mode (big/high-contrast)</label>
      </div>

      <button class="btn marker" id="startBtn">Launch the race</button>
      <button class="btn ghost small" id="resetHistory" style="margin-top:8px; width:100%;">Reset no-repeat history</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <div class="starfield" id="starfield"></div>
        <div class="stage-header">
          <span class="status" id="statusText">Ready when you are</span>
          <span class="clock" id="clock">–</span>
        </div>
        <div class="track-area" id="trackArea"></div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script src="../assets/js/suspense-fx.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const durationEl = document.getElementById("duration");
  const durationVal = document.getElementById("durationVal");
  const noRepeatEl = document.getElementById("noRepeat");
  const projectorEl = document.getElementById("projector");
  const startBtn = document.getElementById("startBtn");
  const resetHistoryBtn = document.getElementById("resetHistory");
  const stage = document.getElementById("stage");
  const trackArea = document.getElementById("trackArea");
  const statusText = document.getElementById("statusText");
  const clock = document.getElementById("clock");
  const winnerBanner = document.getElementById("winnerBanner");
  const historyList = document.getElementById("historyList");
  const starfield = document.getElementById("starfield");

  const DUCK_SVG = `<svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 15 L44 6 Q58 15 44 24 Z" fill="var(--c,#d9503f)"/>
    <circle cx="30" cy="15" r="4.5" fill="#eef1fb"/>
    <path d="M18 8 L28 11 L18 12 Z" fill="#8fb9d8"/>
    <path d="M18 22 L28 19 L18 18 Z" fill="#8fb9d8"/>
  </svg>`;
  const PALETTE = ["#d9503f", "#efb93c", "#8fb9d8", "#c98fd8", "#ffffff", "#35604a"];

  let alreadyWon = [];
  let racing = false;

  for (let i = 0; i < 60; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() < 0.85 ? 1 + Math.random() : 2 + Math.random();
    s.style.cssText = `left:${Math.random()*100}%; top:${Math.random()*100}%; width:${size}px; height:${size}px;
      animation-duration:${1.5 + Math.random()*3}s; animation-delay:${Math.random()*3}s;`;
    starfield.appendChild(s);
  }

  durationEl.addEventListener("input", () => { durationVal.textContent = durationEl.value + "s"; });
  projectorEl.addEventListener("change", () => stage.classList.toggle("projector", projectorEl.checked));
  resetHistoryBtn.addEventListener("click", () => {
    alreadyWon = [];
    renderHistory();
  });

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }

  function renderHistory() {
    if (!alreadyWon.length) { historyList.innerHTML = ""; return; }
    historyList.innerHTML = "Already won this round: " +
      alreadyWon.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function buildStage(order) {
    trackArea.innerHTML = "";
    trackArea.parentElement.classList.toggle("many-names", order.length > 14);
    trackArea.classList.toggle("many-names", order.length > 14);
    stage.classList.toggle("many-names", order.length > 14);

    order.forEach((entrant, i) => {
      const lane = document.createElement("div");
      lane.className = "lane";
      lane.id = `lane-${i}`;
      const color = PALETTE[i % PALETTE.length];
      lane.innerHTML = `
        <div class="lane-name">${escapeHtml(entrant.name)}</div>
        <div class="track" data-idx="${i}">
          <div class="finish-mark"></div>
          <div class="duck-token" id="duck-${i}" style="--c:${color}">${DUCK_SVG.replace('var(--c,#efb93c)', color)}</div>
        </div>`;
      trackArea.appendChild(lane);
    });
  }

  async function runRace() {
    if (racing) return;
    const roster = getNames();
    if (roster.length < 2) {
      statusText.textContent = "Add at least two names first";
      return;
    }
    racing = true;
    winnerBanner.classList.remove("show");
    stage.classList.remove("finished-glow");
    const duration = Number(durationEl.value);
    const result = RaceEngine.run(roster, {
      duration,
      noRepeat: noRepeatEl.checked,
      alreadyWon,
    });

    const byName = Object.fromEntries(result.order.map((o) => [o.name, o]));
    const displayOrder = result.eligiblePool.map((name) => byName[name]);
    buildStage(displayOrder);

    statusText.textContent = "Ignition sequence…";
    await SuspenseFX.countdown(stage, ["3", "2", "1", "LIFTOFF!"]);
    SuspenseFX.shake(stage, 420);

    statusText.textContent = "3, 2, 1… liftoff!";
    const start = performance.now();
    const maxTime = Math.max(...displayOrder.map((o) => o.finishTime)) + 0.3;
    let lastLeaderIdx = -1;

    function frame(now) {
      const elapsed = (now - start) / 1000;
      clock.textContent = Math.max(0, (duration - elapsed)).toFixed(1) + "s";

      let leaderIdx = 0, leaderProgress = -1;
      displayOrder.forEach((entrant, i) => {
        const el = document.getElementById(`duck-${i}`);
        if (!el) return;
        const track = el.parentElement;
        const trackW = track.clientWidth - el.clientWidth;
        const prevLeft = parseFloat(el.dataset.prevLeft || "0");
        const progress = entrant.progressAt(elapsed);
        const left = progress * trackW;
        el.style.left = left + "px";
        el.classList.toggle("surging", left - prevLeft > 2.2);
        el.dataset.prevLeft = left;
        if (progress > leaderProgress) { leaderProgress = progress; leaderIdx = i; }
      });

      if (leaderIdx !== lastLeaderIdx) {
        document.querySelectorAll(".lane.leader").forEach((l) => l.classList.remove("leader"));
        const el = document.getElementById(`lane-${leaderIdx}`);
        if (el) el.classList.add("leader");
        lastLeaderIdx = leaderIdx;
      }

      if (elapsed < maxTime) {
        requestAnimationFrame(frame);
      } else {
        finishRace(result);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishRace(result) {
    racing = false;
    SuspenseFX.flash(stage, 500);
    stage.classList.add("finished-glow");
    setTimeout(() => stage.classList.remove("finished-glow"), 1400);
    statusText.textContent = "We have a winner";
    clock.textContent = "🏁";
    winnerBanner.classList.remove("show");
    void winnerBanner.offsetWidth;
    winnerBanner.textContent = `🚀 ${result.winner} blasts across the line first!`;
    winnerBanner.classList.add("show");
    if (result.photoFinish) SuspenseFX.photoFinishBanner(stage, "Photo finish!");
    if (noRepeatEl.checked) {
      alreadyWon.push(result.winner);
      renderHistory();
    }
    const rect = stage.getBoundingClientRect();
    SuspenseFX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  startBtn.addEventListener("click", runRace);
  buildStage(getNames().map((name) => ({ name, finishTime: 1, progressAt: () => 0 })));
</script>

</body>
</html>
