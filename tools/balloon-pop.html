<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop Name Picker — Pick &amp; Race</title>
<meta name="description" content="Balloons float and drift as they inflate, wobbling wilder the bigger they get — first one to pop wins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel { border: var(--border); border-radius: var(--radius); background: var(--paper); padding: 20px; position: sticky; top: 20px; }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  textarea { width: 100%; min-height: 140px; border: var(--border); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical; }
  input[type="range"] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.88rem; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .duration-val { font-family: var(--font-display); font-weight: 700; }

  .stage {
    border: var(--border); border-radius: var(--radius);
    background: linear-gradient(180deg, #cfe6f5, #eaf5fb);
    padding: 16px;
    min-height: 460px;
    position: relative; overflow: hidden;
  }
  .stage.projector { background: #0e1a2b; }
  .stage.projector .flight-name { background: rgba(0,0,0,0.45); color: #fff; }
  .stage.finished-glow { box-shadow: 0 0 0 4px var(--marker), 0 0 40px rgba(217,80,63,0.5) inset; }

  /* Climax vignette: kicks in once the leading balloon gets dangerously
     big, so the whole stage reads as "any second now" instead of the
     tension living only in the balloons themselves. */
  .stage.climax { animation: climaxPulse 0.55s ease-in-out infinite; }
  @keyframes climaxPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,80,63,0); }
    50% { box-shadow: 0 0 46px 8px rgba(217,80,63,0.38) inset; }
  }

  .cloud { position: absolute; background: rgba(255,255,255,0.75); border-radius: 999px; filter: blur(1px); animation: drift linear infinite; z-index: 0; }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(110%); } }

  .stage-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; position: relative; z-index: 5; }
  .stage-header .status { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
  .stage.projector .stage-header .status { color: #fff; }
  .stage-header .clock { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; transition: color 0.2s ease; }
  .stage.projector .stage-header .clock { color: var(--pencil); }
  .stage-header .clock.hot { color: var(--marker); animation: clockPulse 0.5s ease-in-out infinite; }
  @keyframes clockPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }

  /* Free-flight sky: balloons are positioned with left/top in JS instead
     of sitting in fixed lanes, so they can drift and swoop around. */
  .flight-area { position: relative; width: 100%; height: 420px; overflow: hidden; z-index: 5; }
  .balloon-wrap {
    position: absolute; top: 0; left: 0; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform 0.15s ease; z-index: 6;
  }
  .balloon-wrap.leader { z-index: 8; }
  .balloon-token {
    position: relative; width: 34px; height: 42px;
    transform: scale(0.35);
    transform-origin: 50% 60%;
    will-change: transform;
  }
  .balloon-token svg { width: 100%; height: 100%; animation: sway 1.1s ease-in-out infinite; transform-origin: 50% 65%; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .balloon-wrap.surging .balloon-token svg { animation-duration: 0.4s; }
  .balloon-wrap.danger .balloon-token svg { animation-duration: 0.26s; filter: drop-shadow(0 0 9px rgba(217,80,63,0.9)); }
  .balloon-wrap.leader .balloon-token svg { filter: drop-shadow(0 0 9px rgba(239,185,60,0.95)); }
  .balloon-wrap.leader.danger .balloon-token svg { filter: drop-shadow(0 0 12px rgba(217,80,63,1)); }
  .balloon-wrap.popped .balloon-token { opacity: 0; transition: opacity 0.15s ease; }
  .balloon-wrap.startled .balloon-token { animation: startle 0.4s ease; }
  @keyframes startle { 0% { transform: scale(var(--s,1)); } 35% { transform: scale(calc(var(--s,1) * 0.86)) rotate(-6deg); } 100% { transform: scale(var(--s,1)); } }

  .flight-name {
    font-size: 0.8rem; font-weight: 600; text-align: center; max-width: 76px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: rgba(255,255,255,0.75); border-radius: 999px; padding: 1px 9px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .balloon-wrap.leader .flight-name { color: var(--marker); }

  .many-names .balloon-token { width: 22px; height: 28px; }
  .many-names .flight-name { font-size: 0.68rem; max-width: 50px; padding: 1px 6px; }

  .winner-banner { margin-top: 14px; border: var(--border); border-radius: var(--radius); background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display); font-size: 1.15rem; display: none; animation: winnerPop 0.5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes winnerPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .winner-banner.show { display: block; }
  .history { margin-top: 16px; font-size: 0.82rem; color: var(--ink-soft); }
  .history .chip { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 0 0; }

  @media (max-width: 860px) {
    .tool-wrap { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
  @media (prefers-reduced-motion: reduce) {
    .balloon-token, .balloon-token svg, .balloon-wrap, .cloud, .stage.climax, .clock.hot { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="rocket-race.html">Spaceship Shootdown</a>
      <a href="turtle-race.html">Turtle Race</a>
      <a href="slot-machine.html">Slot Machine</a>
      <a href="spinning-wheel.html">Wheel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Balloon Pop Name Picker</h1>
  <p>Balloons float and drift around the sky as they inflate, wobbling wilder the bigger they get. First one to reach full size pops — and wins. Works for 2 names or 40.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo
Yuki
Isla</textarea>

      <label for="duration">Race length: <span class="duration-val" id="durationVal">8s</span></label>
      <input type="range" id="duration" min="2" max="30" value="8">

      <div class="toggle-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat" style="margin:0;">No repeats until everyone's had a turn</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="projector">
        <label for="projector" style="margin:0;">Projector mode (big/high-contrast)</label>
      </div>

      <button class="btn marker" id="startBtn">Inflate &amp; release</button>
      <button class="btn ghost small" id="resetHistory" style="margin-top:8px; width:100%;">Reset no-repeat history</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <div id="clouds"></div>
        <div class="stage-header">
          <span class="status" id="statusText">Ready when you are</span>
          <span class="clock" id="clock">–</span>
        </div>
        <div class="flight-area" id="flightArea"></div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script src="../assets/js/sound-fx.js"></script>
<script src="../assets/js/suspense-fx.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const durationEl = document.getElementById("duration");
  const durationVal = document.getElementById("durationVal");
  const noRepeatEl = document.getElementById("noRepeat");
  const projectorEl = document.getElementById("projector");
  const startBtn = document.getElementById("startBtn");
  const resetHistoryBtn = document.getElementById("resetHistory");
  const stage = document.getElementById("stage");
  const flightArea = document.getElementById("flightArea");
  const statusText = document.getElementById("statusText");
  const clock = document.getElementById("clock");
  const winnerBanner = document.getElementById("winnerBanner");
  const historyList = document.getElementById("historyList");
  const clouds = document.getElementById("clouds");

  const PALETTE = ["#d9503f", "#efb93c", "#35604a", "#8fb9d8", "#c98fd8", "#ffffff"];

  // shade(color, amt): nudge every RGB channel of a hex color by amt
  // (negative = darker, positive = lighter) to derive real matching
  // shadow/highlight tones from each racer's palette color.
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const clamp = (v) => Math.min(255, Math.max(0, v));
    const r = clamp((n >> 16) + amt), g = clamp(((n >> 8) & 0xff) + amt), b = clamp((n & 0xff) + amt);
    return `#${(1 << 24 | (r << 16) | (g << 8) | b).toString(16).slice(1)}`;
  }

  // A glossy latex balloon instead of one flat-filled ellipse: a multi-stop
  // radial gradient (light upper-left) for a rounded, stretched-rubber
  // look, a broad soft sheen plus a sharp specular dot (the combo that
  // reads as "shiny", not just "light"), and a dark rim shadow along the
  // lower edge so it reads as a sphere, not a disc. Each balloon gets its
  // own gradient id since every one renders its own inline <svg>.
  function balloonHTML(color, idx) {
    const gid = `balloonGrad${idx}`;
    const mid = shade(color, -20);
    const deep = shade(color, -90);
    const knot = shade(color, -35);
    return `<svg viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="${gid}" cx="34%" cy="24%" r="82%">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.85"/>
          <stop offset="18%" stop-color="#fff" stop-opacity="0.4"/>
          <stop offset="42%" stop-color="${color}" stop-opacity="1"/>
          <stop offset="78%" stop-color="${mid}" stop-opacity="1"/>
          <stop offset="100%" stop-color="${deep}" stop-opacity="1"/>
        </radialGradient>
      </defs>
      <ellipse cx="20" cy="18" rx="16" ry="18" fill="url(#${gid})" stroke="${deep}" stroke-width="0.5" stroke-opacity="0.4"/>
      <ellipse cx="14" cy="11" rx="6" ry="8.5" fill="#fff" opacity="0.32" transform="rotate(-18 14 11)"/>
      <ellipse cx="12.3" cy="8" rx="2" ry="2.8" fill="#fff" opacity="0.8" transform="rotate(-18 12.3 8)"/>
      <path d="M8 29 Q20 37 32 29 Q20 34 8 29 Z" fill="rgba(0,0,0,0.17)"/>
      <path d="M20 36 L17 40 L23 40 Z" fill="${knot}"/>
      <ellipse cx="20" cy="36.6" rx="2.1" ry="0.9" fill="rgba(255,255,255,0.35)"/>
      <path d="M20 40 Q16 44 20 50" stroke="#4a5674" stroke-width="1.2" fill="none"/>
    </svg>`;
  }

  let alreadyWon = [];
  let racing = false;
  let homes = [];

  const MIN_SCALE = 0.35;      // starting (barely-inflated) size
  const MAX_SCALE = 1.3;       // size right at pop
  const POP_SCALE = MAX_SCALE + 0.3;
  const DANGER_AT = 0.8;       // progress fraction where the "about to pop" jitters kick in
  const rand = (a, b) => a + Math.random() * (b - a);

  for (let i = 0; i < 5; i++) {
    const c = document.createElement("div");
    c.className = "cloud";
    const w = 60 + Math.random() * 70;
    c.style.cssText = `width:${w}px; height:${w*0.5}px; top:${5 + Math.random()*70}%;
      animation-duration:${22 + Math.random()*18}s; animation-delay:${-Math.random()*20}s;`;
    clouds.appendChild(c);
  }

  durationEl.addEventListener("input", () => { durationVal.textContent = durationEl.value + "s"; });
  projectorEl.addEventListener("change", () => stage.classList.toggle("projector", projectorEl.checked));
  resetHistoryBtn.addEventListener("click", () => { alreadyWon = []; renderHistory(); });

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }

  function renderHistory() {
    if (!alreadyWon.length) { historyList.innerHTML = ""; return; }
    historyList.innerHTML = "Already won this round: " +
      alreadyWon.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  /**
   * A tiny confetti-dust mote that spawns at a balloon's current on-screen
   * position and drifts off, fading out — a light trail so a fast-growing,
   * fast-flying balloon leaves a little wake of sparkle behind it instead
   * of just silently sliding across the sky.
   */
  function spawnTrail(x, y, color) {
    const el = document.createElement("div");
    const size = 4 + Math.random() * 4;
    el.style.cssText = `position:fixed; top:${y}px; left:${x}px; width:${size}px; height:${size}px;
      background:${color}; border-radius:50%; z-index:998; pointer-events:none; opacity:0.85;`;
    document.body.appendChild(el);
    const dx = rand(-14, 14), dy = rand(10, 26);
    const anim = el.animate(
      [
        { transform: "translate(0,0) scale(1)", opacity: 0.85, offset: 0 },
        { transform: `translate(${dx}px, ${dy}px) scale(0.4)`, opacity: 0, offset: 1 },
      ],
      { duration: 500 + Math.random() * 250, easing: "ease-out" }
    );
    anim.onfinish = () => el.remove();
  }

  /**
   * Lays balloons out on a rough grid of "home" positions (so a big roster
   * doesn't all pile into the same spot), each with its own random flight
   * personality — independent wobble frequencies/phases/amplitudes for x
   * and y — so every balloon drifts and swoops on its own unique, organic
   * path instead of a single shared pattern that would read as robotic.
   */
  function buildStage(order) {
    flightArea.innerHTML = "";
    const many = order.length > 14;
    flightArea.classList.toggle("many-names", many);

    const w = flightArea.clientWidth || 640;
    const h = flightArea.clientHeight || 420;
    const n = order.length;
    const cols = Math.max(1, Math.round(Math.sqrt(n * (w / h))));
    const rows = Math.max(1, Math.ceil(n / cols));

    homes = order.map((entrant, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const jitterX = rand(-0.28, 0.28) / cols;
      const jitterY = rand(-0.28, 0.28) / rows;
      const color = PALETTE[i % PALETTE.length];

      const wrap = document.createElement("div");
      wrap.className = "balloon-wrap";
      wrap.id = `wrap-${i}`;
      wrap.innerHTML = `
        <div class="balloon-token" id="balloon-${i}">${balloonHTML(color, i)}</div>
        <div class="flight-name">${escapeHtml(entrant.name)}</div>`;
      flightArea.appendChild(wrap);

      return {
        xFrac: Math.min(1, Math.max(0, (col + 0.5) / cols + jitterX)),
        yFrac: Math.min(1, Math.max(0, (row + 0.5) / rows + jitterY)),
        ampXFrac: 0.5 / cols,
        ampYFrac: 0.5 / rows,
        fy1: rand(0.22, 0.4), py1: rand(0, Math.PI * 2),
        fy2: rand(0.45, 0.75), py2: rand(0, Math.PI * 2),
        fj: rand(0.5, 0.95), pj: rand(0, Math.PI * 2),
        color,
        lastTrail: 0,
        wentDanger: false,
      };
    });
  }

  async function runRace() {
    if (racing) return;
    const roster = getNames();
    if (roster.length < 2) { statusText.textContent = "Add at least two names first"; return; }
    racing = true;
    winnerBanner.classList.remove("show");
    stage.classList.remove("finished-glow", "climax");
    clock.classList.remove("hot");
    const duration = Number(durationEl.value);
    const result = RaceEngine.run(roster, { duration, noRepeat: noRepeatEl.checked, alreadyWon });

    const byName = Object.fromEntries(result.order.map((o) => [o.name, o]));
    const displayOrder = result.eligiblePool.map((name) => byName[name]);
    buildStage(displayOrder);

    statusText.textContent = "Get ready…";
    await SuspenseFX.countdown(stage, ["READY!", "3", "2", "1", "Inflate!"], null, flightArea);

    statusText.textContent = "Inflating…";
    SoundFX.slideWhistle(300, 1500, 0.6, 0.1);
    const start = performance.now();
    // Timed to the WINNER's own inflation time, not the slowest balloon's, so
    // the clock/finish actually land the instant the winner pops instead of
    // the winner popping while the clock still counts down for stragglers.
    const winnerTime = displayOrder.find((o) => o.name === result.winner).finishTime;
    const maxTime = winnerTime; // the engine sets this to the slider value (see race-engine.js)
    let lastLeaderIdx = -1;
    let winnerPopped = false;
    let lastGroupShake = 0;
    let climaxOn = false;
    let lastHeartbeat = 0;
    const many = displayOrder.length > 14;
    const showTrails = !many; // keep the sky readable when the roster is big

    function frame(now) {
      const elapsed = (now - start) / 1000;
      clock.textContent = Math.max(0, maxTime - elapsed).toFixed(1) + "s"; // maxTime == the slider value (engine guarantees it)

      const areaW = flightArea.clientWidth, areaH = flightArea.clientHeight;
      // Horizontal margin has to clear the name tag (wider than the balloon
      // itself); vertical has to clear the balloon-plus-tag stack at its
      // biggest (near-pop) size. Sized so a balloon's full silhouette stays
      // inside the visible box at all times instead of clipping at the edge.
      const marginX = many ? 28 : 42;
      const marginY = many ? 34 : 48;

      let leaderIdx = 0, leaderProgress = -1, surgingCount = 0;
      displayOrder.forEach((entrant, i) => {
        const wrapEl = document.getElementById(`wrap-${i}`);
        const el = document.getElementById(`balloon-${i}`);
        const home = homes[i];
        if (!wrapEl || !el || !home) return;

        const progress = entrant.progressAt(elapsed);
        const prevScale = parseFloat(el.dataset.prevScale || String(MIN_SCALE));
        const scale = MIN_SCALE + progress * (MAX_SCALE - MIN_SCALE);

        // Flight gets a bit more lively as a balloon grows — a slow, calm
        // drift near the start, a touch livelier right before it pops —
        // but stays gentle throughout rather than swinging wildly.
        const intensity = 1 + progress * 0.85;
        const ampX = home.ampXFrac * areaW * 0.55;
        const ampY = home.ampYFrac * areaH * 0.55;
        const baseX = marginX + home.xFrac * (areaW - marginX * 2);
        const baseY = marginY + home.yFrac * (areaH - marginY * 2);
        const lateral = entrant.lateralAt ? entrant.lateralAt(elapsed) : 0; // -1..1, tied to the underlying pace sim
        const jitter = Math.sin(elapsed * home.fj + home.pj);
        const xOff = (lateral * 0.7 + jitter * 0.3) * ampX * intensity;
        const yOff = (Math.sin(elapsed * home.fy1 + home.py1) * 0.65 +
                      Math.sin(elapsed * home.fy2 + home.py2) * 0.35) * ampY * intensity;
        // Clamped to the FULL margin (not half) so the balloon's whole
        // silhouette — including the name tag — never slips past the edge
        // of the visible box, even mid-swing.
        const x = Math.min(areaW - marginX, Math.max(marginX, baseX + xOff));
        const y = Math.min(areaH - marginY, Math.max(marginY, baseY + yOff));
        wrapEl.style.left = x + "px";
        wrapEl.style.top = y + "px";
        el.style.transform = `scale(${scale.toFixed(3)})`;

        const surging = scale - prevScale > 0.008;
        wrapEl.classList.toggle("surging", surging);
        if (surging) surgingCount++;
        el.dataset.prevScale = scale;

        const inDanger = progress >= DANGER_AT;
        wrapEl.classList.toggle("danger", inDanger && !winnerPopped);
        if (inDanger && !home.wentDanger) {
          home.wentDanger = true;
          SoundFX.squeak(1.35 + Math.random() * 0.2);
        }

        if (showTrails) {
          const spawnGap = 260 - progress * 170;
          if (now - home.lastTrail > spawnGap) {
            home.lastTrail = now;
            const rect = wrapEl.getBoundingClientRect();
            spawnTrail(rect.left + rect.width / 2, rect.top + rect.height * 0.35, home.color);
          }
        }

        if (progress >= 0.999 && entrant.name === result.winner && !winnerPopped) {
          winnerPopped = true;
          el.style.transform = `scale(${POP_SCALE.toFixed(2)})`;
          wrapEl.classList.add("popped");
          SoundFX.balloonPop();
        }
        if (progress > leaderProgress) { leaderProgress = progress; leaderIdx = i; }
      });

      if (displayOrder.length >= 3 && surgingCount / displayOrder.length >= 0.35 && now - lastGroupShake > 900) {
        lastGroupShake = now;
        SoundFX.squeak(0.9 + Math.random() * 0.5);   // rubbery squeaks as the pack surges
        SuspenseFX.microShake(stage);
      }

      if (leaderIdx !== lastLeaderIdx) {
        document.querySelectorAll(".balloon-wrap.leader").forEach((c) => c.classList.remove("leader"));
        const el = document.getElementById(`wrap-${leaderIdx}`);
        if (el) el.classList.add("leader");
        if (lastLeaderIdx !== -1) SoundFX.leadChange();
        lastLeaderIdx = leaderIdx;
      }

      // A rising "heartbeat" squeak tied to whoever's currently biggest —
      // quiet and slow early on, faster and higher-pitched as they get
      // closer to popping, so the tension builds in the ears as well as
      // on screen.
      if (leaderProgress > 0.45 && !winnerPopped) {
        const gap = 620 - leaderProgress * 420;
        if (now - lastHeartbeat > gap) {
          lastHeartbeat = now;
          SoundFX.squeak(1 + leaderProgress * 0.75);
        }
      }

      // Climax mode: once the leader is deep in the danger zone, the whole
      // stage starts pulsing and the clock throbs too, so the tension isn't
      // only visible on the one balloon you happen to be looking at.
      const wantsClimax = leaderProgress >= 0.88;
      if (wantsClimax !== climaxOn) {
        climaxOn = wantsClimax;
        stage.classList.toggle("climax", climaxOn);
        clock.classList.toggle("hot", climaxOn);
        if (climaxOn) { SuspenseFX.flash(stage); SoundFX.gasp(); }
      }

      if (elapsed < maxTime) {
        requestAnimationFrame(frame);
      } else {
        finishRace(result, displayOrder);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishRace(result, displayOrder) {
    racing = false;
    stage.classList.remove("climax");
    clock.classList.remove("hot");
    SuspenseFX.shake(stage, 300);
    SuspenseFX.flash(stage, 400);
    SuspenseFX.winnerSpotlight(stage);
    stage.classList.add("finished-glow");
    setTimeout(() => stage.classList.remove("finished-glow"), 1400);
    statusText.textContent = "Pop!";
    clock.textContent = "🎈";
    winnerBanner.classList.remove("show");
    void winnerBanner.offsetWidth;
    winnerBanner.innerHTML = `<span class="wb-eyebrow">🏆 Winner</span><span class="wb-name">🎈 ${escapeHtml(result.winner)}'s balloon is the first to pop!</span>`;
    winnerBanner.classList.add("show");
    if (result.photoFinish) SuspenseFX.photoFinishBanner(stage, "Photo finish!");
    if (noRepeatEl.checked) { alreadyWon.push(result.winner); renderHistory(); }

    // Everyone else gets a little startled jump at the pop, so the moment
    // reads as something that just happened *to the whole flock*, not only
    // to the winner. A staggered squeak chorus sells the same beat in sound.
    let squeakDelay = 0;
    displayOrder.forEach((entrant, i) => {
      if (entrant.name === result.winner) return;
      const wrapEl = document.getElementById(`wrap-${i}`);
      if (wrapEl) wrapEl.classList.add("startled");
      squeakDelay += 40 + Math.random() * 50;
      setTimeout(() => SoundFX.squeak(0.8 + Math.random() * 0.5), squeakDelay);
    });

    const winnerIdx = result.eligiblePool.indexOf(result.winner);
    const winnerEl = document.getElementById(`wrap-${winnerIdx}`);
    const rect = (winnerEl || stage).getBoundingClientRect();
    SuspenseFX.burst(rect.left + rect.width / 2, rect.top);
  }

  startBtn.addEventListener("click", runRace);
  buildStage(getNames().map((name) => ({ name, finishTime: 1, progressAt: () => 0 })));
</script>
