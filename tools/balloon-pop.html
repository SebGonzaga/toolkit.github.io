<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop Name Picker — Pick &amp; Race</title>
<meta name="description" content="Balloons rise toward the ceiling — first one there wins and pops.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel { border: var(--border); border-radius: var(--radius); background: var(--paper); padding: 20px; position: sticky; top: 20px; }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  textarea { width: 100%; min-height: 140px; border: var(--border); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical; }
  input[type="range"] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.88rem; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .duration-val { font-family: var(--font-display); font-weight: 700; }

  .stage {
    border: var(--border); border-radius: var(--radius);
    background: linear-gradient(180deg, #cfe6f5, #eaf5fb);
    padding: 16px;
    min-height: 460px;
  }
  .stage.projector { background: #0e1a2b; }
  .stage.projector .col-name { color: #fff; }
  .stage.projector .col-track { background: rgba(255,255,255,0.08); }

  .stage-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .stage-header .status { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
  .stage.projector .stage-header .status { color: #fff; }
  .stage-header .clock { font-family: var(--font-display); font-size: 1.4rem; }
  .stage.projector .stage-header .clock { color: var(--pencil); }

  .track-area { display: flex; gap: 14px; overflow-x: auto; padding: 8px 4px 4px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; }
  .col-track {
    position: relative; width: 46px; height: 340px;
    background: rgba(255,255,255,0.5); border-radius: 999px; overflow: hidden;
  }
  .col-track .ceiling-mark {
    position: absolute; top: 6px; left: 0; right: 0; height: 2px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px);
  }
  .balloon-token {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 34px; height: 42px;
    transition: bottom 0.08s linear;
  }
  .balloon-token svg { width: 100%; height: 100%; animation: sway 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .col-name { font-size: 0.82rem; font-weight: 600; text-align: center; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .many-names .col-track { width: 28px; }
  .many-names .balloon-token { width: 22px; height: 28px; }
  .many-names .col-name { font-size: 0.72rem; max-width: 46px; }

  .winner-banner { margin-top: 14px; border: var(--border); border-radius: var(--radius); background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display); font-size: 1.15rem; display: none; }
  .winner-banner.show { display: block; }
  .history { margin-top: 16px; font-size: 0.82rem; color: var(--ink-soft); }
  .history .chip { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 0 0; }

  @media (max-width: 860px) {
    .tool-wrap { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
  @media (prefers-reduced-motion: reduce) {
    .balloon-token, .balloon-token svg { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="rocket-race.html">Rocket Race</a>
      <a href="turtle-race.html">Turtle Race</a>
      <a href="spinning-wheel.html">Wheel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Balloon Pop Name Picker</h1>
  <p>Balloons rise toward the ceiling. First one to reach it pops and wins. Works for 2 names or 40.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo
Yuki
Isla</textarea>

      <label for="duration">Race length: <span class="duration-val" id="durationVal">8s</span></label>
      <input type="range" id="duration" min="2" max="30" value="8">

      <div class="toggle-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat" style="margin:0;">No repeats until everyone's had a turn</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="projector">
        <label for="projector" style="margin:0;">Projector mode (big/high-contrast)</label>
      </div>

      <button class="btn marker" id="startBtn">Inflate &amp; release</button>
      <button class="btn ghost small" id="resetHistory" style="margin-top:8px; width:100%;">Reset no-repeat history</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <div class="stage-header">
          <span class="status" id="statusText">Ready when you are</span>
          <span class="clock" id="clock">–</span>
        </div>
        <div class="track-area" id="trackArea"></div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const durationEl = document.getElementById("duration");
  const durationVal = document.getElementById("durationVal");
  const noRepeatEl = document.getElementById("noRepeat");
  const projectorEl = document.getElementById("projector");
  const startBtn = document.getElementById("startBtn");
  const resetHistoryBtn = document.getElementById("resetHistory");
  const stage = document.getElementById("stage");
  const trackArea = document.getElementById("trackArea");
  const statusText = document.getElementById("statusText");
  const clock = document.getElementById("clock");
  const winnerBanner = document.getElementById("winnerBanner");
  const historyList = document.getElementById("historyList");

  const BALLOON_SVG = `<svg viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="20" cy="18" rx="16" ry="18" fill="var(--c,#d9503f)"/>
    <path d="M20 36 L17 40 L23 40 Z" fill="var(--c,#d9503f)"/>
    <path d="M20 40 Q16 44 20 50" stroke="#4a5674" stroke-width="1.2" fill="none"/>
  </svg>`;
  const PALETTE = ["#d9503f", "#efb93c", "#35604a", "#8fb9d8", "#c98fd8", "#ffffff"];

  let alreadyWon = [];
  let racing = false;

  durationEl.addEventListener("input", () => { durationVal.textContent = durationEl.value + "s"; });
  projectorEl.addEventListener("change", () => stage.classList.toggle("projector", projectorEl.checked));
  resetHistoryBtn.addEventListener("click", () => { alreadyWon = []; renderHistory(); });

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }

  function renderHistory() {
    if (!alreadyWon.length) { historyList.innerHTML = ""; return; }
    historyList.innerHTML = "Already won this round: " +
      alreadyWon.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function buildStage(order) {
    trackArea.innerHTML = "";
    trackArea.classList.toggle("many-names", order.length > 14);

    order.forEach((entrant, i) => {
      const col = document.createElement("div");
      col.className = "col";
      const color = PALETTE[i % PALETTE.length];
      col.innerHTML = `
        <div class="col-track" data-idx="${i}">
          <div class="ceiling-mark"></div>
          <div class="balloon-token" id="balloon-${i}">${BALLOON_SVG.replace(/var\\(--c,#d9503f\\)/g, color)}</div>
        </div>
        <div class="col-name">${escapeHtml(entrant.name)}</div>`;
      trackArea.appendChild(col);
    });
  }

  function runRace() {
    if (racing) return;
    const roster = getNames();
    if (roster.length < 2) { statusText.textContent = "Add at least two names first"; return; }
    racing = true;
    winnerBanner.classList.remove("show");
    const duration = Number(durationEl.value);
    const result = RaceEngine.run(roster, { duration, noRepeat: noRepeatEl.checked, alreadyWon });

    const byName = Object.fromEntries(result.order.map((o) => [o.name, o.finishTime]));
    const displayOrder = result.eligiblePool.map((name) => ({ name, finishTime: byName[name] }));
    buildStage(displayOrder);

    statusText.textContent = "Rising…";
    const start = performance.now();
    const maxTime = Math.max(...displayOrder.map((o) => o.finishTime)) + 0.3;

    function frame(now) {
      const elapsed = (now - start) / 1000;
      clock.textContent = Math.max(0, (duration - elapsed)).toFixed(1) + "s";
      displayOrder.forEach((entrant, i) => {
        const el = document.getElementById(`balloon-${i}`);
        if (!el) return;
        const track = el.parentElement;
        const trackH = track.clientHeight - el.clientHeight;
        const progress = Math.min(1, elapsed / entrant.finishTime);
        el.style.bottom = (progress * trackH) + "px";
      });
      if (elapsed < maxTime) {
        requestAnimationFrame(frame);
      } else {
        finishRace(result.winner);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishRace(winner) {
    racing = false;
    statusText.textContent = "Pop!";
    clock.textContent = "🎈";
    winnerBanner.textContent = `🎈 ${winner}'s balloon pops at the top first!`;
    winnerBanner.classList.add("show");
    if (noRepeatEl.checked) { alreadyWon.push(winner); renderHistory(); }
    launchConfetti();
  }

  function launchConfetti() {
    for (let i = 0; i < 24; i++) {
      const c = document.createElement("div");
      const colors = ["#efb93c", "#d9503f", "#35604a", "#1e2a45"];
      c.style.cssText = `position:fixed; top:-10px; left:${Math.random()*100}vw; width:8px; height:8px;
        background:${colors[i % colors.length]}; z-index:999; pointer-events:none;
        transform:rotate(${Math.random()*360}deg);`;
      document.body.appendChild(c);
      const fall = c.animate(
        [{ transform: `translateY(0) rotate(0deg)`, opacity: 1 },
         { transform: `translateY(100vh) rotate(${360 + Math.random()*360}deg)`, opacity: 0 }],
        { duration: 1400 + Math.random() * 900, easing: "ease-in" }
      );
      fall.onfinish = () => c.remove();
    }
  }

  startBtn.addEventListener("click", runRace);
  buildStage(getNames().map((name) => ({ name, finishTime: 1 })));
</script>

</body>
</html>
