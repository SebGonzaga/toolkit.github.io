<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yes / No Decision Wheel — Pick &amp; Race</title>
<meta name="description" content="Not a name picker — a decision wheel. Ask a question, spin, and let the wheel say yes, no, or maybe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel { border: var(--border); border-radius: var(--radius); background: var(--paper); padding: 20px; }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  input[type="text"], textarea { width: 100%; border: var(--border); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 0.9rem; background: #fff; color: var(--ink); }
  textarea { min-height: 90px; resize: vertical; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { border: var(--border); background: var(--paper); border-radius: 999px; padding: 5px 12px; font: 600 0.8rem var(--font-body); cursor: pointer; color: var(--ink); }
  .presets button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .hint { font-size: 0.8rem; color: var(--ink-soft); margin: 8px 0 0; }

  .stage { border: var(--border); border-radius: var(--radius); background: var(--chalk-dim); padding: 24px; min-height: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .stage.finished-glow { box-shadow: 0 0 0 4px var(--pencil), 0 0 44px rgba(239,185,60,0.6) inset; }
  .question { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.15rem, 3vw, 1.6rem); text-align: center; margin: 0 0 18px; min-height: 1.3em; max-width: 30ch; }
  .wheel-wrap { position: relative; width: 340px; height: 340px; max-width: 100%; transition: transform 0.4s ease; }
  .wheel-wrap.zoom { transform: scale(1.05); }
  .wheel-glow { position: absolute; inset: -10px; border-radius: 50%; box-shadow: 0 0 0 0 rgba(239,185,60,0.5); transition: box-shadow 0.15s ease; }
  .wheel-glow.pulse { box-shadow: 0 0 0 10px rgba(239,185,60,0.28); }
  .pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 24px solid var(--ink); z-index: 3; transform-origin: 50% 0%; transition: transform 0.08s ease; filter: drop-shadow(0 2px 0 rgba(255,255,255,0.6)); }
  .pointer.tick { transform: translateX(-50%) rotate(14deg); }
  svg#wheel { width: 100%; height: 100%; border-radius: 50%; border: var(--border); position: relative; z-index: 1; background: var(--paper); }
  .hub { position: absolute; z-index: 2; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: var(--border); background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 2px 0 var(--ink); }

  .result-banner { margin-top: 20px; min-height: 64px; border: var(--border); border-radius: var(--radius); background: var(--pencil-dim); padding: 12px 24px; text-align: center; font-family: var(--font-display); display: none; animation: winnerPop 0.5s cubic-bezier(.2,1.4,.4,1); }
  .result-banner.show { display: block; }
  .result-banner .ans { display: block; font-weight: 800; font-size: 2rem; line-height: 1.1; }
  @keyframes winnerPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .tally { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; font-size: 0.85rem; min-height: 28px; }
  .tally .t { border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 600; background: var(--paper); }
  .tally .t b { font-family: var(--font-display); }
  .tally .reset { border: 0; background: transparent; text-decoration: underline; color: var(--ink-soft); cursor: pointer; font: 500 0.8rem var(--font-body); }

  @media (max-width: 860px) { .tool-wrap { grid-template-columns: 1fr; } .wheel-wrap { width: 290px; height: 290px; } }
  @media (prefers-reduced-motion: reduce) { .pointer, .wheel-glow, .wheel-wrap { transition: none !important; } }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="spinning-wheel.html">Wheel</a>
      <a href="slot-machine.html">Slot Machine</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Yes / No Decision Wheel</h1>
  <p>For the questions that aren't about who goes next. Should we go outside? Extra five minutes of reading? Let the wheel decide.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="question">Question (optional)</label>
      <input type="text" id="question" placeholder="Should we take the quiz outside?" maxlength="80">

      <label>Wheel options</label>
      <div class="presets" id="presets" role="group" aria-label="Presets">
        <button type="button" aria-pressed="true" data-opts="Yes,No">Yes / No</button>
        <button type="button" aria-pressed="false" data-opts="Yes,No,Maybe">Yes / No / Maybe</button>
        <button type="button" aria-pressed="false" data-opts="Do it,Skip it">Do it / Skip it</button>
        <button type="button" aria-pressed="false" data-opts="">Custom</button>
      </div>
      <textarea id="opts" style="margin-top:10px;" aria-label="Options, one per line">Yes
No</textarea>
      <p class="hint">Each option gets an equal chance, however many slices it takes up on the wheel.</p>

      <button class="btn marker" id="spinBtn">Spin the wheel</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <p class="question" id="questionText"></p>
        <div class="wheel-wrap" id="wheelWrap">
          <div class="wheel-glow" id="wheelGlow"></div>
          <div class="pointer" id="pointer"></div>
          <svg id="wheel" viewBox="0 0 200 200" role="img" aria-label="Decision wheel"></svg>
          <div class="hub" id="hub">🎯</div>
        </div>
        <div class="result-banner" id="resultBanner" aria-live="polite"></div>
        <div class="tally" id="tally"></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script src="../assets/js/suspense-fx.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const wheel = $("wheel"), wheelWrap = $("wheelWrap"), wheelGlow = $("wheelGlow"), pointer = $("pointer");
  const stage = $("stage"), banner = $("resultBanner"), hub = $("hub");
  // Fixed colours for the classic answers so "Yes" is always green and "No" always red.
  const FIXED = { yes: ["#35604a", "#fff"], no: ["#d9503f", "#fff"], maybe: ["#efb93c", "#1e2a45"], "do it": ["#35604a", "#fff"], "skip it": ["#d9503f", "#fff"] };
  const CYCLE = [["#1e2a45", "#fff"], ["#efb93c", "#1e2a45"], ["#3f7fae", "#fff"], ["#c98fd8", "#1e2a45"], ["#8fb9d8", "#1e2a45"], ["#fbf7ee", "#1e2a45"]];
  let spinning = false, currentRotation = 0, slices = [], tally = {};

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const getOptions = () => [...new Set($("opts").value.split("\n").map((s) => s.trim()).filter(Boolean))].slice(0, 12);
  const point = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [100 + r * Math.cos(a), 100 + r * Math.sin(a)]; };

  function colorFor(opt, idx) {
    const f = FIXED[opt.toLowerCase()];
    return f || CYCLE[idx % CYCLE.length];
  }

  // Repeat the options around the wheel so a two-option wheel still looks
  // like a wheel (and pointer ticks feel right), not a split circle.
  function buildSlices(opts) {
    const reps = Math.max(1, Math.ceil(8 / opts.length));
    const out = [];
    for (let k = 0; k < reps; k++) opts.forEach((o, i) => out.push({ label: o, opt: i }));
    return out;
  }

  function drawWheel() {
    const opts = getOptions();
    slices = buildSlices(opts);
    const n = slices.length, sl = 360 / n;
    let svg = "";
    slices.forEach((s, i) => {
      const a0 = i * sl, a1 = a0 + sl;
      const [x1, y1] = point(96, a0), [x2, y2] = point(96, a1);
      const [fill, ink] = colorFor(s.label, s.opt);
      svg += `<path d="M100,100 L${x1},${y1} A96,96 0 ${sl > 180 ? 1 : 0} 1 ${x2},${y2} Z" fill="${fill}" stroke="#fbf7ee" stroke-width="1.2"/>`;
      const mid = a0 + sl / 2;
      const [tx, ty] = point(60, mid);
      const size = Math.max(6, Math.min(13, 96 / Math.max(4, s.label.slice(0, 14).length)) * (n > 10 ? 0.8 : 1));
      const rot = mid < 180 ? mid - 90 : mid + 90;   // radial text, always upright-ish
      svg += `<text x="${tx}" y="${ty}" font-size="${size.toFixed(1)}" font-family="Baloo 2, Inter, sans-serif" font-weight="800" fill="${ink}" text-anchor="middle" dominant-baseline="central" transform="rotate(${rot}, ${tx}, ${ty})">${esc(s.label.slice(0, 14))}</text>`;
    });
    wheel.innerHTML = svg;
  }

  // Presets
  document.querySelectorAll("#presets button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#presets button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    if (b.dataset.opts) $("opts").value = b.dataset.opts.split(",").join("\n");
    else { $("opts").focus(); }
    tally = {}; renderTally(); drawWheel();
  }));
  $("opts").addEventListener("input", () => {
    // Editing the list by hand means it's "Custom" unless it still matches a preset.
    const cur = getOptions().join(",");
    let matched = null;
    document.querySelectorAll("#presets button").forEach((b) => { if (b.dataset.opts && b.dataset.opts === cur) matched = b; });
    document.querySelectorAll("#presets button").forEach((b) => b.setAttribute("aria-pressed", (matched ? b === matched : !b.dataset.opts) ? "true" : "false"));
    if (!spinning) drawWheel();
  });
  $("question").addEventListener("input", () => { if (!spinning) $("questionText").textContent = $("question").value.trim(); });

  const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);

  function renderTally() {
    const keys = Object.keys(tally);
    $("tally").innerHTML = keys.length
      ? keys.map((k) => `<span class="t">${esc(k)} <b>${tally[k]}</b></span>`).join("") + '<button class="reset" id="resetTally">reset tally</button>'
      : "";
    const r = $("resetTally"); if (r) r.addEventListener("click", () => { tally = {}; renderTally(); });
  }

  function spin() {
    if (spinning) return;
    const opts = getOptions();
    if (opts.length < 2) { banner.className = "result-banner show"; banner.innerHTML = '<span class="ans" style="font-size:1rem">Add at least two options</span>'; return; }
    spinning = true; $("spinBtn").disabled = true;
    banner.classList.remove("show"); stage.classList.remove("finished-glow");
    hub.textContent = "🎯";
    $("questionText").textContent = $("question").value.trim();
    drawWheel();

    // Equal odds per option: pick the option first, then a random slice of it.
    const winnerOpt = RaceEngine.run(opts, { duration: 1 }).winner;
    const candidates = slices.map((s, i) => [s, i]).filter(([s]) => s.label === winnerOpt);
    const [, winIdx] = candidates[Math.floor(Math.random() * candidates.length)];
    const n = slices.length, sl = 360 / n;
    const jitter = (Math.random() - 0.5) * sl * 0.6;            // land anywhere inside the slice, not dead centre
    const targetMid = winIdx * sl + sl / 2 + jitter;
    const laps = 6 + Math.floor(Math.random() * 3);
    const delta = laps * 360 + (360 - targetMid) - (currentRotation % 360);
    const duration = 5200 + Math.random() * 1200;
    const startRot = currentRotation;
    const t0 = performance.now();
    let lastTick = -1, zoomed = false;

    (async () => {
      await SuspenseFX.countdown(stage, ["READY!", "3", "2", "1", "Spin!"]);
      const start = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const rot = startRot + delta * easeOutQuint(t);
        wheel.style.transform = `rotate(${rot}deg)`;
        if (t > 0.82 && !zoomed) { zoomed = true; wheelWrap.classList.add("zoom"); }
        const tick = Math.floor(rot / sl);
        if (tick !== lastTick) {
          lastTick = tick;
          pointer.classList.add("tick"); wheelGlow.classList.add("pulse");
          setTimeout(() => { pointer.classList.remove("tick"); wheelGlow.classList.remove("pulse"); }, 90);
        }
        if (t < 1) requestAnimationFrame(frame);
        else { currentRotation = rot % 360; finish(winnerOpt, opts); }
      }
      requestAnimationFrame(frame);
    })();
  }

  function finish(answer, opts) {
    spinning = false; $("spinBtn").disabled = false;
    wheelWrap.classList.remove("zoom");
    const [fill, ink] = colorFor(answer, opts.indexOf(answer));
    banner.style.background = fill; banner.style.color = ink;
    banner.innerHTML = `<span class="ans">${esc(answer)}${answer.toLowerCase() === "yes" ? "!" : ""}</span>`;
    banner.classList.remove("show"); void banner.offsetWidth; banner.classList.add("show");
    hub.textContent = { yes: "👍", no: "👎", maybe: "🤔" }[answer.toLowerCase()] || "✨";
    tally[answer] = (tally[answer] || 0) + 1; renderTally();
    SuspenseFX.shake(wheelWrap, 260);
    SuspenseFX.winnerSpotlight(stage);
    stage.classList.add("finished-glow");
    setTimeout(() => stage.classList.remove("finished-glow"), 1400);
    const r = wheelWrap.getBoundingClientRect();
    SuspenseFX.burst(r.left + r.width / 2, r.top + r.height / 2, { count: 28 });
  }

  $("spinBtn").addEventListener("click", spin);
  drawWheel();
</script>

</body>
</html>
