<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinning Wheel Name Picker — Pick &amp; Race</title>
<meta name="description" content="Spin a wheel of names — powered by the same fair engine as the duck race.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel { border: var(--border); border-radius: var(--radius); background: var(--paper); padding: 20px; }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  textarea { width: 100%; min-height: 140px; border: var(--border); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }

  .stage { border: var(--border); border-radius: var(--radius); background: var(--chalk-dim); padding: 24px; min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .stage.finished-glow { box-shadow: 0 0 0 4px var(--pencil), 0 0 44px rgba(239,185,60,0.6) inset; }
  .wheel-wrap { position: relative; width: 320px; height: 320px; }
  .wheel-glow {
    position: absolute; inset: -10px; border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(239,185,60,0.5);
    transition: box-shadow 0.15s ease;
  }
  .wheel-glow.pulse { box-shadow: 0 0 0 10px rgba(239,185,60,0.28); }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%) rotate(0deg); width: 0; height: 0;
    border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 20px solid var(--ink); z-index: 2;
    transform-origin: 50% 0%; transition: transform 0.08s ease;
  }
  .pointer.tick { transform: translateX(-50%) rotate(14deg); }
  svg#wheel { width: 100%; height: 100%; border-radius: 50%; border: var(--border); position: relative; z-index: 1; }
  .sparkle { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; pointer-events: none; }
  .winner-banner { margin-top: 20px; border: var(--border); border-radius: var(--radius); background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display); font-size: 1.15rem; display: none; animation: winnerPop 0.5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes winnerPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .winner-banner.show { display: block; }

  @media (max-width: 860px) { .tool-wrap { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .pointer, .wheel-glow { transition: none !important; } }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="rocket-race.html">Rocket Race</a>
      <a href="turtle-race.html">Turtle Race</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Spinning Wheel Name Picker</h1>
  <p>Same fair engine as the duck race, wearing a different skin.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo</textarea>
      <button class="btn marker" id="spinBtn">Spin the wheel</button>
    </div>
    <div>
      <div class="stage" id="stage">
        <div class="wheel-wrap">
          <div class="wheel-glow" id="wheelGlow"></div>
          <div class="pointer" id="pointer"></div>
          <svg id="wheel" viewBox="0 0 200 200"></svg>
        </div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script src="../assets/js/suspense-fx.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const wheel = document.getElementById("wheel");
  const wheelWrap = document.querySelector(".wheel-wrap");
  const wheelGlow = document.getElementById("wheelGlow");
  const pointer = document.getElementById("pointer");
  const stage = document.getElementById("stage");
  const spinBtn = document.getElementById("spinBtn");
  const winnerBanner = document.getElementById("winnerBanner");
  const COLORS = ["#efb93c", "#d9503f", "#35604a", "#1e2a45", "#8fb9d8", "#c98fd8", "#fbf7ee"];
  let spinning = false, currentRotation = 0;

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }

  function drawWheel(names) {
    const n = names.length;
    const slice = 360 / n;
    const cx = 100, cy = 100, r = 96;
    let svg = "";
    names.forEach((name, i) => {
      const start = i * slice, end = start + slice;
      const [x1, y1] = point(cx, cy, r, start);
      const [x2, y2] = point(cx, cy, r, end);
      const large = slice > 180 ? 1 : 0;
      svg += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${COLORS[i % COLORS.length]}" stroke="#1e2a45" stroke-width="1"/>`;
      const mid = start + slice / 2;
      const [tx, ty] = point(cx, cy, r * 0.62, mid);
      svg += `<text x="${tx}" y="${ty}" font-size="9" font-family="Inter, sans-serif" font-weight="600" fill="#1e2a45" text-anchor="middle" transform="rotate(${mid + (mid>90&&mid<270?180:0)}, ${tx}, ${ty})">${escapeHtml(name).slice(0,10)}</text>`;
    });
    wheel.innerHTML = svg;
  }

  function point(cx, cy, r, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

  function sparkleBurst() {
    const rect = wheelWrap.getBoundingClientRect();
    for (let i = 0; i < 10; i++) {
      const s = document.createElement("div");
      s.className = "sparkle";
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 60;
      s.style.left = (rect.width / 2 + Math.cos(angle) * 10) + "px";
      s.style.top = (rect.height / 2 + Math.sin(angle) * 10) + "px";
      wheelWrap.appendChild(s);
      const anim = s.animate(
        [{ transform: "translate(0,0)", opacity: 1 },
         { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`, opacity: 0 }],
        { duration: 500 + Math.random() * 300, easing: "ease-out" }
      );
      anim.onfinish = () => s.remove();
    }
  }

  async function spin() {
    if (spinning) return;
    const names = getNames();
    if (names.length < 2) return;
    spinning = true;
    winnerBanner.classList.remove("show");
    stage.classList.remove("finished-glow");
    drawWheel(names);

    const result = RaceEngine.run(names, { duration: 1 }); // engine just decides the winner
    const winnerIdx = names.indexOf(result.winner);
    const slice = 360 / names.length;
    const targetMid = winnerIdx * slice + slice / 2;
    const extraSpins = 6 + Math.floor(Math.random() * 3); // suspense: unpredictable number of laps
    const totalDelta = extraSpins * 360 + (360 - targetMid) - (currentRotation % 360);
    const spinDuration = 5200 + Math.random() * 1200;
    const startRotation = currentRotation;

    const start = performance.now();
    let lastTickSlice = -1;

    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / spinDuration);
      const eased = easeOutQuint(t);
      const rotation = startRotation + totalDelta * eased;
      wheel.style.transform = `rotate(${rotation}deg)`;

      const tickSlice = Math.floor(rotation / slice);
      if (tickSlice !== lastTickSlice) {
        lastTickSlice = tickSlice;
        pointer.classList.add("tick");
        wheelGlow.classList.add("pulse");
        setTimeout(() => { pointer.classList.remove("tick"); wheelGlow.classList.remove("pulse"); }, 90);
      }

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        currentRotation = rotation % 360;
        finishSpin(result);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(result) {
    spinning = false;
    SuspenseFX.shake(wheelWrap, 260);
    stage.classList.add("finished-glow");
    setTimeout(() => stage.classList.remove("finished-glow"), 1400);
    sparkleBurst();
    winnerBanner.classList.remove("show");
    void winnerBanner.offsetWidth;
    winnerBanner.textContent = `🎉 ${result.winner} wins the spin!`;
    winnerBanner.classList.add("show");
    const rect = wheelWrap.getBoundingClientRect();
    SuspenseFX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  spinBtn.addEventListener("click", spin);
  drawWheel(getNames());
</script>

</body>
</html>
