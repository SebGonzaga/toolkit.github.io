<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Machine Name Picker — Pick &amp; Race</title>
<meta name="description" content="Pull the lever — reels spin and lock in a name.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel { border: var(--border); border-radius: var(--radius); background: var(--paper); padding: 20px; position: sticky; top: 20px; }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  textarea { width: 100%; min-height: 140px; border: var(--border); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical; }
  input[type="range"] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.88rem; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .duration-val { font-family: var(--font-display); font-weight: 700; }

  .stage {
    border: var(--border); border-radius: var(--radius);
    background: linear-gradient(180deg, #f6dfc0, #f1cfa0);
    padding: 24px;
    min-height: 460px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .stage.projector { background: #241407; }
  .stage.projector .machine { background: #100a05; border-color: #fff; }
  .stage.projector .status { color: #fff; }
  .stage.finished-glow .machine { box-shadow: 0 0 0 4px var(--pencil), 0 0 44px rgba(239,185,60,0.65); }

  .stage-header { position: absolute; top: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 24px; z-index: 5; }
  .stage { position: relative; }
  .stage-header .status { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
  .stage-header .clock { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }

  .marquee { position: absolute; inset: 16px; pointer-events: none; z-index: 0; }
  .bulb { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--pencil); opacity: 0.35; animation: bulbFlicker 1.6s ease-in-out infinite; }
  .bulb.excited { animation-duration: 0.35s; opacity: 0.9; }
  @keyframes bulbFlicker { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }

  .machine {
    background: var(--ink); border: 4px solid var(--ink); border-radius: 18px;
    padding: 20px 20px 28px; display: flex; gap: 10px; margin-top: 34px;
    position: relative; z-index: 5; transition: box-shadow 0.3s ease;
  }
  .reel-window {
    width: 90px; height: 100px; background: var(--paper); border-radius: 8px; overflow: hidden;
    position: relative; box-shadow: inset 0 0 0 2px var(--ink);
  }
  .reel-window.name-reel { width: 190px; }
  .reel-window.spinning .reel-strip { filter: blur(3px); }
  .reel-window.locking { animation: reelLock 0.3s ease; }
  @keyframes reelLock { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .reel-strip { position: absolute; top: 0; left: 0; width: 100%; }
  .reel-item { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
  .reel-item.name-item { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--ink); text-align: center; padding: 0 8px; }
  .reel-window::before, .reel-window::after {
    content: ""; position: absolute; left: 0; right: 0; height: 26px; z-index: 2;
  }
  .reel-window::before { top: 0; background: linear-gradient(180deg, var(--paper), transparent); }
  .reel-window::after { bottom: 0; background: linear-gradient(0deg, var(--paper), transparent); }

  .lever { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .lever .stick { width: 8px; height: 60px; background: var(--marker); border-radius: 4px; transform-origin: bottom center; transition: transform 0.25s ease; }
  .lever .knob { width: 22px; height: 22px; border-radius: 50%; background: var(--marker); border: 2px solid var(--ink); margin-bottom: -4px; }
  .lever.pulled .stick { transform: rotate(28deg); }

  .winner-banner { margin-top: 22px; border: var(--border); border-radius: var(--radius); background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display); font-size: 1.15rem; display: none; animation: winnerPop 0.5s cubic-bezier(.2,1.4,.4,1); position: relative; z-index: 5; }
  @keyframes winnerPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .winner-banner.show { display: block; }
  .history { margin-top: 16px; font-size: 0.82rem; color: var(--ink-soft); }
  .history .chip { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 0 0; }

  @media (max-width: 860px) {
    .tool-wrap { grid-template-columns: 1fr; }
    .panel { position: static; }
    .machine { flex-wrap: wrap; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reel-strip, .bulb, .reel-window { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="ball-drop.html">Ball Drop</a>
      <a href="balloon-pop.html">Balloon Pop</a>
      <a href="spinning-wheel.html">Wheel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Slot Machine Name Picker</h1>
  <p>Pull the lever. Two decorative reels spin for flavor, the middle reel is the pick.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo
Yuki
Isla</textarea>

      <label for="duration">Spin length: <span class="duration-val" id="durationVal">4s</span></label>
      <input type="range" id="duration" min="2" max="8" value="4">

      <div class="toggle-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat" style="margin:0;">No repeats until everyone's had a turn</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="projector">
        <label for="projector" style="margin:0;">Projector mode (big/high-contrast)</label>
      </div>

      <button class="btn marker" id="startBtn">Pull the lever</button>
      <button class="btn ghost small" id="resetHistory" style="margin-top:8px; width:100%;">Reset no-repeat history</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <div class="marquee" id="marquee"></div>
        <div class="stage-header">
          <span class="status" id="statusText">Ready when you are</span>
          <span class="clock" id="clock">–</span>
        </div>
        <div class="machine" id="machine">
          <div class="reel-window" id="reelWinLeft"><div class="reel-strip" id="reelLeft"></div></div>
          <div class="reel-window name-reel" id="reelWinName"><div class="reel-strip" id="reelName"></div></div>
          <div class="reel-window" id="reelWinRight"><div class="reel-strip" id="reelRight"></div></div>
          <div class="lever" id="lever"><div class="stick"></div><div class="knob"></div></div>
        </div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script src="../assets/js/suspense-fx.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const durationEl = document.getElementById("duration");
  const durationVal = document.getElementById("durationVal");
  const noRepeatEl = document.getElementById("noRepeat");
  const projectorEl = document.getElementById("projector");
  const startBtn = document.getElementById("startBtn");
  const resetHistoryBtn = document.getElementById("resetHistory");
  const stage = document.getElementById("stage");
  const machine = document.getElementById("machine");
  const lever = document.getElementById("lever");
  const reelWinLeft = document.getElementById("reelWinLeft");
  const reelWinName = document.getElementById("reelWinName");
  const reelWinRight = document.getElementById("reelWinRight");
  const reelName = document.getElementById("reelName");
  const reelLeft = document.getElementById("reelLeft");
  const reelRight = document.getElementById("reelRight");
  const statusText = document.getElementById("statusText");
  const clock = document.getElementById("clock");
  const winnerBanner = document.getElementById("winnerBanner");
  const historyList = document.getElementById("historyList");
  const marquee = document.getElementById("marquee");

  const ITEM_H = 100;
  const SYMBOLS = ["⭐", "🍎", "✏️", "📚", "🎓", "🍏"];
  let alreadyWon = [];
  let spinning = false;
  let bulbs = [];

  for (let i = 0; i < 18; i++) {
    const b = document.createElement("div");
    b.className = "bulb";
    const angle = (i / 18) * Math.PI * 2;
    const rx = 48, ry = 48;
    b.style.left = `calc(50% + ${Math.cos(angle) * rx}% - 4px)`;
    b.style.top = `calc(50% + ${Math.sin(angle) * ry}% - 4px)`;
    b.style.animationDelay = (Math.random() * 1.5) + "s";
    marquee.appendChild(b);
    bulbs.push(b);
  }

  durationEl.addEventListener("input", () => { durationVal.textContent = durationEl.value + "s"; });
  projectorEl.addEventListener("change", () => stage.classList.toggle("projector", projectorEl.checked));
  resetHistoryBtn.addEventListener("click", () => { alreadyWon = []; renderHistory(); });

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }
  function renderHistory() {
    if (!alreadyWon.length) { historyList.innerHTML = ""; return; }
    historyList.innerHTML = "Already won this round: " +
      alreadyWon.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function buildSymbolStrip(el, loops) {
    let html = "";
    for (let i = 0; i < loops; i++) {
      SYMBOLS.forEach((s) => { html += `<div class="reel-item">${s}</div>`; });
    }
    el.innerHTML = html;
    el.style.transition = "none";
    el.style.transform = "translateY(0px)";
  }

  function buildNameStrip(names, winner) {
    // Build a long shuffled strip; force the last item to equal winner so it lands centered.
    const loops = 6;
    let strip = [];
    for (let i = 0; i < loops; i++) strip = strip.concat(RaceEngine.shuffle(names));
    strip.push(winner);
    reelName.innerHTML = strip.map((n) => `<div class="reel-item name-item">${escapeHtml(n)}</div>`).join("");
    reelName.style.transition = "none";
    reelName.style.transform = "translateY(0px)";
    return strip.length;
  }

  function spinTo(el, finalIndex, duration) {
    const target = -(finalIndex * ITEM_H);
    requestAnimationFrame(() => {
      el.style.transition = `transform ${duration}s cubic-bezier(.12,.7,.15,1)`;
      el.style.transform = `translateY(${target}px)`;
    });
  }

  async function runSpin() {
    if (spinning) return;
    const roster = getNames();
    if (roster.length < 2) { statusText.textContent = "Add at least two names first"; return; }
    spinning = true;
    winnerBanner.classList.remove("show");
    stage.classList.remove("finished-glow");
    lever.classList.add("pulled");
    setTimeout(() => lever.classList.remove("pulled"), 300);
    SuspenseFX.shake(machine, 300);

    const duration = Number(durationEl.value);
    const result = RaceEngine.run(roster, { duration, noRepeat: noRepeatEl.checked, alreadyWon });

    buildSymbolStrip(reelLeft, 8);
    buildSymbolStrip(reelRight, 8);
    const stripLen = buildNameStrip(result.eligiblePool, result.winner);

    [reelWinLeft, reelWinName, reelWinRight].forEach((w) => w.classList.add("spinning"));
    bulbs.forEach((b) => b.classList.add("excited"));

    statusText.textContent = "Spinning…";
    const start = performance.now();
    const tick = () => {
      const elapsed = (performance.now() - start) / 1000;
      clock.textContent = Math.max(0, duration - elapsed).toFixed(1) + "s";
      if (elapsed < duration) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    const dLeft = duration * 0.7;
    const dRight = duration * 0.85;
    const dName = duration;

    requestAnimationFrame(() => {
      spinTo(reelLeft, SYMBOLS.length * 6 + Math.floor(Math.random() * SYMBOLS.length), dLeft);
      spinTo(reelRight, SYMBOLS.length * 6 + Math.floor(Math.random() * SYMBOLS.length), dRight);
      spinTo(reelName, stripLen - 1, dName);
    });

    setTimeout(() => { reelWinLeft.classList.remove("spinning"); reelWinLeft.classList.add("locking"); SuspenseFX.flash(reelWinLeft, 300); }, dLeft * 1000);
    setTimeout(() => { reelWinRight.classList.remove("spinning"); reelWinRight.classList.add("locking"); SuspenseFX.flash(reelWinRight, 300); }, dRight * 1000);
    // Beat of suspense: hush right before the name reel locks.
    setTimeout(() => { statusText.textContent = "Almost there…"; }, dName * 1000 - 550);

    setTimeout(() => finishSpin(result), dName * 1000 + 80);
  }

  function finishSpin(result) {
    spinning = false;
    reelWinName.classList.remove("spinning");
    reelWinName.classList.add("locking");
    SuspenseFX.flash(reelWinName, 450);
    SuspenseFX.shake(machine, 300);
    bulbs.forEach((b) => b.classList.remove("excited"));
    stage.classList.add("finished-glow");
    setTimeout(() => stage.classList.remove("finished-glow"), 1500);
    statusText.textContent = "Locked in!";
    clock.textContent = "🎰";
    winnerBanner.classList.remove("show");
    void winnerBanner.offsetWidth;
    winnerBanner.textContent = `🎰 The reels lock in ${result.winner}!`;
    winnerBanner.classList.add("show");
    if (noRepeatEl.checked) { alreadyWon.push(result.winner); renderHistory(); }
    const rect = machine.getBoundingClientRect();
    SuspenseFX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  startBtn.addEventListener("click", runSpin);
  buildSymbolStrip(reelLeft, 3);
  buildSymbolStrip(reelRight, 3);
  reelName.innerHTML = getNames().map((n) => `<div class="reel-item name-item">${escapeHtml(n)}</div>`).join("");
</script>

</body>
</html>
