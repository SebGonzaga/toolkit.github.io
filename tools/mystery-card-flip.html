<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Card Flip Name Picker — Pick &amp; Race</title>
<meta name="description" content="Flip through a deck of mystery cards, faster and faster, until one turns over and reveals your pick.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel { border: var(--border); border-radius: var(--radius); background: var(--paper); padding: 20px; position: sticky; top: 20px; }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  textarea { width: 100%; min-height: 140px; border: var(--border); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical; }
  input[type="range"] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.88rem; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .duration-val { font-family: var(--font-display); font-weight: 700; }

  .stage {
    border: var(--border); border-radius: var(--radius);
    background: radial-gradient(ellipse at 50% 28%, #2f6f55, #163d2c 78%);
    padding: 24px;
    min-height: 460px;
    position: relative; overflow: hidden;
  }
  .stage.projector { background: radial-gradient(ellipse at 50% 28%, #12291d, #060f0a 78%); }
  .stage.finished-glow { box-shadow: 0 0 0 4px var(--pencil), 0 0 44px rgba(239,185,60,0.55) inset; }

  /* Felt-table texture + a soft vignette so the deck reads as sitting on a
     surface, not floating on a flat color. */
  .felt-texture { position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: repeating-linear-gradient(120deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 5px);
  }
  .felt-vignette { position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,0.35) 100%);
  }

  .stage-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; position: relative; z-index: 5; }
  .stage-header .status { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: #fdf6e6; }
  .stage-header .clock { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; color: var(--pencil); }

  .card-arena { display: flex; align-items: center; justify-content: center; gap: 44px; min-height: 340px; position: relative; z-index: 5; perspective: 1000px; }

  /* A fanned pile of face-down cards sitting beside the reveal slot — purely
     decorative "rest of the deck" so the table doesn't feel empty. */
  .deck-pile { position: relative; width: 84px; height: 118px; }
  .deck-pile .deck-card {
    position: absolute; inset: 0; border-radius: 9px;
    background: repeating-linear-gradient(45deg, #1e2a45 0 7px, #26345a 7px 14px);
    border: 2px solid var(--pencil); box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  .deck-pile .deck-card::after { content: "✦"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: rgba(239,185,60,0.55); }
  .deck-pile .deck-card:nth-child(1) { transform: rotate(-7deg) translate(-3px, 2px); }
  .deck-pile .deck-card:nth-child(2) { transform: rotate(-2deg) translate(0, 1px); }
  .deck-pile .deck-card:nth-child(3) { transform: rotate(4deg); }

  .card-slot { width: 190px; height: 260px; position: relative; }
  .flip-card {
    width: 100%; height: 100%; border-radius: 14px;
    background: var(--paper);
    border: 4px solid var(--pencil);
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    transform-style: preserve-3d;
    transition: transform 0.16s cubic-bezier(.4,0,.2,1);
  }
  .flip-card.mystery { background: repeating-linear-gradient(45deg, #1e2a45 0 9px, #26345a 9px 18px); border-color: var(--marker); }
  .flip-card.mystery::after { content: "✨"; font-size: 2.6rem; }
  .flip-card.locked { border-color: var(--pencil); box-shadow: 0 8px 26px rgba(239,185,60,0.55), 0 0 0 3px rgba(239,185,60,0.35); }
  .card-name {
    font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; text-align: center;
    padding: 0 12px; color: var(--ink); line-height: 1.25; word-break: break-word;
  }

  .winner-banner { margin-top: 14px; border: var(--border); border-radius: var(--radius); background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display); font-size: 1.15rem; display: none; animation: winnerPop 0.5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes winnerPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .winner-banner.show { display: block; }
  .history { margin-top: 16px; font-size: 0.82rem; color: var(--ink-soft); }
  .history .chip { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 0 0; }

  @media (max-width: 860px) {
    .tool-wrap { grid-template-columns: 1fr; }
    .panel { position: static; }
    .card-arena { gap: 20px; }
    .deck-pile { width: 60px; height: 84px; }
    .card-slot { width: 150px; height: 210px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flip-card, .stage { transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="ball-drop.html">Ball Drop</a>
      <a href="slot-machine.html">Slot Machine</a>
      <a href="spinning-wheel.html">Wheel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Mystery Card Flip Name Picker</h1>
  <p>A deck of face-down cards flips through the names, faster at first, then slower — the one it lands on is your pick.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo
Yuki
Isla</textarea>

      <label for="duration">Flip length: <span class="duration-val" id="durationVal">6s</span></label>
      <input type="range" id="duration" min="3" max="12" value="6">

      <div class="toggle-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat" style="margin:0;">No repeats until everyone's had a turn</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="projector">
        <label for="projector" style="margin:0;">Projector mode (big/high-contrast)</label>
      </div>

      <button class="btn marker" id="startBtn">Flip the deck</button>
      <button class="btn ghost small" id="resetHistory" style="margin-top:8px; width:100%;">Reset no-repeat history</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <div class="felt-texture"></div>
        <div class="felt-vignette"></div>
        <div class="stage-header">
          <span class="status" id="statusText">Ready when you are</span>
          <span class="clock" id="clock">–</span>
        </div>
        <div class="card-arena" id="cardArena">
          <div class="deck-pile"><div class="deck-card"></div><div class="deck-card"></div><div class="deck-card"></div></div>
          <div class="card-slot">
            <div class="flip-card mystery" id="flipCard"><span class="card-name" id="cardName"></span></div>
          </div>
        </div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script src="../assets/js/suspense-fx.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const durationEl = document.getElementById("duration");
  const durationVal = document.getElementById("durationVal");
  const noRepeatEl = document.getElementById("noRepeat");
  const projectorEl = document.getElementById("projector");
  const startBtn = document.getElementById("startBtn");
  const resetHistoryBtn = document.getElementById("resetHistory");
  const stage = document.getElementById("stage");
  const cardArena = document.getElementById("cardArena");
  const flipCard = document.getElementById("flipCard");
  const cardName = document.getElementById("cardName");
  const statusText = document.getElementById("statusText");
  const clock = document.getElementById("clock");
  const winnerBanner = document.getElementById("winnerBanner");
  const historyList = document.getElementById("historyList");

  let alreadyWon = [];
  let flipping = false;

  durationEl.addEventListener("input", () => { durationVal.textContent = durationEl.value + "s"; });
  projectorEl.addEventListener("change", () => stage.classList.toggle("projector", projectorEl.checked));
  resetHistoryBtn.addEventListener("click", () => { alreadyWon = []; renderHistory(); });

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }
  function renderHistory() {
    if (!alreadyWon.length) { historyList.innerHTML = ""; return; }
    historyList.innerHTML = "Already won this round: " +
      alreadyWon.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // Build the sequence of names the card flips through: several shuffled
  // loops of the pool (so no name repeats twice in a row when avoidable),
  // capped to a sane length, with the winner forced as the very last flip.
  function buildRevealSequence(names, winner) {
    const targetLen = Math.max(10, Math.min(26, names.length * 2));
    let seq = [];
    while (seq.length < targetLen) seq = seq.concat(RaceEngine.shuffle(names));
    seq = seq.slice(0, targetLen - 1);
    if (seq[seq.length - 1] === winner) seq.pop(); // avoid landing on it twice in a row
    seq.push(winner);
    return seq;
  }

  // One coin-flip: rotate to the edge (90deg, effectively invisible), swap
  // the label while it's edge-on, then rotate back — a classic "reveal the
  // next card" flip rather than a full 3D two-sided card.
  function flipTo(name, duration, mystery) {
    return new Promise((resolve) => {
      flipCard.style.transitionDuration = (duration * 0.5).toFixed(3) + "s";
      flipCard.style.transform = "rotateY(90deg) scaleX(0.85)";
      setTimeout(() => {
        cardName.textContent = name;
        flipCard.classList.toggle("mystery", !!mystery);
        flipCard.style.transform = "rotateY(0deg) scaleX(1)";
        setTimeout(resolve, duration * 500);
      }, duration * 500);
    });
  }

  async function runFlip() {
    if (flipping) return;
    const roster = getNames();
    if (roster.length < 2) { statusText.textContent = "Add at least two names first"; return; }
    flipping = true;
    winnerBanner.classList.remove("show");
    stage.classList.remove("finished-glow");
    flipCard.classList.remove("locked");
    flipCard.classList.add("mystery");
    cardName.textContent = "";

    const totalDuration = Number(durationEl.value);
    const result = RaceEngine.run(roster, { duration: totalDuration, noRepeat: noRepeatEl.checked, alreadyWon });
    const sequence = buildRevealSequence(result.eligiblePool, result.winner);

    statusText.textContent = "Shuffling…";
    await SuspenseFX.countdown(stage, ["READY!", "3", "2", "1", "Flip!"], null, cardArena);

    statusText.textContent = "Flipping through the deck…";

    // TIMER CONTRACT: the slider value is exactly when the winner is revealed.
    // Flip lengths still grow on an ease-in cubic (many quick flips early,
    // one long final reveal), but they're normalised so they sum to the
    // slider, and every flip is scheduled against the real clock so timer
    // drift can't accumulate.
    const n = sequence.length;
    const minStep = 0.05, maxStep = 0.85;
    const weights = sequence.map((_, i) => minStep + (maxStep - minStep) * Math.pow((i + 1) / n, 3));
    const wSum = weights.reduce((a, b) => a + b, 0);
    const ends = [];
    weights.reduce((acc, w, i) => (ends[i] = acc + (w / wSum) * totalDuration), 0);

    const start = performance.now();
    const tickClock = setInterval(() => {
      const left = totalDuration - (performance.now() - start) / 1000;
      clock.textContent = Math.max(0, left).toFixed(1) + "s";
    }, 50);
    for (let i = 0; i < n; i++) {
      const isLast = i === n - 1;
      const nowSec = (performance.now() - start) / 1000;
      const step = Math.max(0.03, ends[i] - nowSec);   // absorb any lateness from earlier flips
      if (isLast) statusText.textContent = "Almost there…";
      await flipTo(sequence[i], step, !isLast);
      if (isLast) SuspenseFX.microShake(stage);
    }
    clearInterval(tickClock);
    clock.textContent = "0.0s";

    finishFlip(result);
  }

  function finishFlip(result) {
    flipping = false;
    flipCard.classList.remove("mystery");
    flipCard.classList.add("locked");
    SuspenseFX.shake(stage, 350);
    SuspenseFX.winnerSpotlight(stage);
    stage.classList.add("finished-glow");
    setTimeout(() => stage.classList.remove("finished-glow"), 1400);
    statusText.textContent = "Revealed!";
    clock.textContent = "🃏";
    winnerBanner.classList.remove("show");
    void winnerBanner.offsetWidth;
    winnerBanner.innerHTML = `<span class="wb-eyebrow">🏆 Winner</span><span class="wb-name">🃏 The deck reveals ${escapeHtml(result.winner)}!</span>`;
    winnerBanner.classList.add("show");
    if (noRepeatEl.checked) { alreadyWon.push(result.winner); renderHistory(); }
    const rect = flipCard.getBoundingClientRect();
    SuspenseFX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  startBtn.addEventListener("click", runFlip);
</script>

</body>
</html>
