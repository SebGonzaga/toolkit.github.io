<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turtle Race Name Picker — Pick &amp; Race</title>
<meta name="description" content="Deliberately, comedically slow — turtles decide who goes first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel {
    border: var(--border); border-radius: var(--radius); background: var(--paper);
    padding: 20px; position: sticky; top: 20px;
  }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  textarea {
    width: 100%; min-height: 140px; border: var(--border); border-radius: 8px;
    padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  input[type="range"] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.88rem; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .duration-val { font-family: var(--font-display); font-weight: 700; }

  .stage {
    border: var(--border); border-radius: var(--radius);
    background: linear-gradient(180deg, #eee3c8, #ded098);
    padding: 16px;
    position: relative; overflow: hidden;
  }
  .stage.projector { background: #241d0f; }
  .stage.projector .field { background: transparent; }
  .stage.projector .field-token .name-tag { background: rgba(255,255,255,0.15); color: #fff; }
  .stage.finished-glow { box-shadow: 0 0 0 4px var(--chalk), 0 0 40px rgba(53,96,74,0.5) inset; }

  .heat-shimmer { position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 7px);
    opacity: 0.4; }

  /* -- track environment: grass verges + a dirt lane, with scattered rocks,
        flowers and bushes instead of one flat tan rectangle -------------- */
  .dirt-bg {
    position: absolute; inset: 0; z-index: 0;
    background:
      linear-gradient(180deg,
        #7fae57 0%, #6f9c4c 13%,
        #d8c393 13%, #cdbb85 50%, #c2ae79 87%,
        #6f9c4c 87%, #628a41 100%);
  }
  .stage.projector .dirt-bg {
    background: linear-gradient(180deg, #1c2b12 0%, #17240e 13%, #3a2f18 13%, #332a15 87%, #17240e 87%, #101a0a 100%);
  }
  .dirt-texture {
    position: absolute; left: 0; right: 0; top: 13%; bottom: 13%; z-index: 0; pointer-events: none;
    background-image: repeating-linear-gradient(94deg, rgba(0,0,0,0.05) 0 3px, transparent 3px 24px);
  }
  .field-decor { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .field-decor .decor { position: absolute; font-size: 1rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25)); }
  .field-decor .decor.bush, .field-decor .decor.flower { animation: decor-sway ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes decor-sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  .turtle-shadow {
    position: absolute; left: 50%; bottom: 2%; width: 78%; height: 20%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,0.32), transparent 72%);
    transform: translateX(-50%); z-index: 1;
  }
  .dust-layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .dust-puff { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle, rgba(150,120,70,0.6), transparent 70%); }
  @keyframes dust-fade { 0% { transform: scale(0.4); opacity: 0.7; } 100% { transform: scale(1.8) translateX(-14px) translateY(3px); opacity: 0; } }

  .stage-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; position: relative; z-index: 5; }
  .stage-header .status { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
  .stage.projector .stage-header .status { color: #fff; }
  .stage-header .clock { font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .stage.projector .stage-header .clock { color: var(--pencil); }

  .field { position: relative; z-index: 5; }
  .field.zoom-mild { transform: scale(1.02); }
  .field.zoom-mild.zoom { transform: scale(1.06); }
  .field .finish-gate { --fc-a: rgba(60,45,20,0.85); --fc-b: rgba(255,246,214,0.92); --finish-glow: rgba(53,96,74,0.55); }
  /* Bigger, more prominent racers: larger token box + a real shadow. */
  .field-token { width: 44px !important; height: 44px !important; }
  .field.many-names .field-token { width: 30px !important; height: 30px !important; }
  /* Perspective wrapper around the turtle art (never on .field-token itself
     — shared-track.js drives that element's own transform for position via
     WAAPI). A slow dome-like sway, distinct from the legs' own gait. */
  .turtle3d {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transform-origin: 50% 85%;
    animation: turtle-sway 1.4s ease-in-out infinite;
  }
  .turtle3d svg { width: 100%; height: 100%; display: block; position: relative; z-index: 2; }
  @keyframes turtle-sway {
    0%,100% { transform: rotateX(4deg) rotateZ(-1.5deg) translateY(0); }
    50%     { transform: rotateX(-3deg) rotateZ(1.5deg) translateY(-1.5px); }
  }
  .field-token.surging .turtle3d { animation-duration: 0.55s; }
  .field-token.stalled .turtle3d { animation-duration: 3.4s; }
  /* Diagonal gait: front-left+back-right swing forward together while
     front-right+back-left swing back, then swap — the way four-legged
     animals actually walk, instead of all four legs moving as one unit. */
  .t-leg { transform-box: fill-box; transform-origin: 50% 20%; animation: leg-stride 1.1s ease-in-out infinite; }
  .t-leg-fl, .t-leg-br { animation-name: leg-stride; }
  .t-leg-fr, .t-leg-bl { animation-name: leg-stride; animation-delay: -0.55s; }
  @keyframes leg-stride { 0%,100% { transform: rotate(-10deg) translateX(-1px); } 50% { transform: rotate(10deg) translateX(1px); } }
  .field-token.surging .t-leg { animation-duration: 0.4s; }
  .field-token.stalled .t-leg { animation-duration: 2.6s; }
  .field-token .dust { position: absolute; bottom: -2px; left: -2px; width: 5px; height: 5px; border-radius: 50%; background: rgba(90,70,30,0.45); pointer-events: none; }

  .winner-banner {
    margin-top: 14px; border: var(--border); border-radius: var(--radius);
    background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display);
    font-size: 1.15rem; display: none;
    animation: winnerPop 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes winnerPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .winner-banner.show { display: block; }

  .history { margin-top: 16px; font-size: 0.82rem; color: var(--ink-soft); }
  .history .chip { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 0 0; }

  @media (max-width: 860px) {
    .tool-wrap { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
  @media (prefers-reduced-motion: reduce) {
    .field-token, .turtle3d, .t-leg, .field-decor .decor { animation: none !important; transition: none !important; transform: none !important; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="rocket-race.html">Rocket Race</a>
      <a href="balloon-pop.html">Balloon Pop</a>
      <a href="ball-drop.html">Ball Drop</a>
      <a href="slot-machine.html">Slot Machine</a>
      <a href="spinning-wheel.html">Wheel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Turtle Race Name Picker</h1>
  <p>Same fair pick, delivered as slowly and dramatically as possible. Great for building suspense.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo
Yuki
Isla</textarea>

      <label for="duration">Race length: <span class="duration-val" id="durationVal">8s</span></label>
      <input type="range" id="duration" min="2" max="30" value="8">

      <div class="toggle-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat" style="margin:0;">No repeats until everyone's had a turn</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="projector">
        <label for="projector" style="margin:0;">Projector mode (big/high-contrast)</label>
      </div>

      <button class="btn marker" id="startBtn">Begin the (slow) race</button>
      <button class="btn ghost small" id="resetHistory" style="margin-top:8px; width:100%;">Reset no-repeat history</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <div class="stage-header">
          <span class="status" id="statusText">Ready when you are</span>
          <span class="clock" id="clock">–</span>
        </div>
        <div class="field-stage">
          <div class="field-wrap" id="fieldWrap">
            <div class="field" id="field">
              <div class="dirt-bg"></div>
              <div class="dirt-texture"></div>
              <div class="heat-shimmer"></div>
              <div class="field-decor" id="fieldDecor"></div>
              <div class="start-gate"></div>
              <div class="finish-gate"></div>
              <div class="dust-layer" id="dustLayer"></div>
              <div class="field-tokens" id="fieldTokens"></div>
            </div>
          </div>
          <div class="leaderboard-panel">
            <div class="lb-title">Standings</div>
            <div class="lb-track" id="leaderboard"></div>
          </div>
        </div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script src="../assets/js/suspense-fx.js"></script>
<script src="../assets/js/shared-track.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const durationEl = document.getElementById("duration");
  const durationVal = document.getElementById("durationVal");
  const noRepeatEl = document.getElementById("noRepeat");
  const projectorEl = document.getElementById("projector");
  const startBtn = document.getElementById("startBtn");
  const resetHistoryBtn = document.getElementById("resetHistory");
  const stage = document.getElementById("stage");
  const fieldWrap = document.getElementById("fieldWrap");
  const field = document.getElementById("field");
  const fieldDecor = document.getElementById("fieldDecor");
  const dustLayer = document.getElementById("dustLayer");
  const fieldTokens = document.getElementById("fieldTokens");
  const leaderboard = document.getElementById("leaderboard");
  const statusText = document.getElementById("statusText");
  const clock = document.getElementById("clock");
  const winnerBanner = document.getElementById("winnerBanner");
  const historyList = document.getElementById("historyList");

  const PALETTE = ["#35604a", "#4a7a5e", "#8a6d3b", "#efb93c", "#6b8f71", "#2f4d3a"];
  const COMMENTARY = ["Plodding along…", "Still plodding…", "Unbelievably slow progress…", "Someone yawned.", "The suspense is agonizing…", "Any minute now…"];

  let alreadyWon = [];
  let racing = false;
  let track = null;
  const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Scatter rocks, flowers and bushes across the grass verges (top/bottom
  // ~13% bands) once, purely decorative and CSS-animated from there.
  const DECOR = [
    { glyph: "🪨", cls: "rock", bands: [true, true] },
    { glyph: "🌼", cls: "flower", bands: [true, true] },
    { glyph: "🌿", cls: "bush", bands: [true, true] },
    { glyph: "🌸", cls: "flower", bands: [true, true] },
  ];
  for (let i = 0; i < 16; i++) {
    const d = DECOR[i % DECOR.length];
    const el = document.createElement("span");
    el.className = "decor " + d.cls;
    el.textContent = d.glyph;
    const inTopBand = i % 2 === 0;
    el.style.left = (2 + Math.random() * 94) + "%";
    el.style.top = inTopBand ? (1 + Math.random() * 8) + "%" : (91 + Math.random() * 7) + "%";
    el.style.fontSize = (0.8 + Math.random() * 0.6) + "rem";
    el.style.opacity = 0.75 + Math.random() * 0.25;
    el.style.animationDuration = (2.4 + Math.random() * 2) + "s";
    el.style.animationDelay = (Math.random() * 2) + "s";
    fieldDecor.appendChild(el);
  }

  function spawnDust(tokEl) {
    if (prefersReducedMotion || dustLayer.childElementCount > 40) return;
    const tRect = tokEl.getBoundingClientRect();
    const fRect = field.getBoundingClientRect();
    const p = document.createElement("div");
    p.className = "dust-puff";
    p.style.left = (tRect.left - fRect.left) + "px";
    p.style.top = (tRect.top - fRect.top + tRect.height * 0.82) + "px";
    p.style.animation = `dust-fade ${0.5 + Math.random() * 0.3}s ease-out forwards`;
    dustLayer.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }

  durationEl.addEventListener("input", () => { durationVal.textContent = durationEl.value + "s"; });
  projectorEl.addEventListener("change", () => stage.classList.toggle("projector", projectorEl.checked));
  resetHistoryBtn.addEventListener("click", () => {
    alreadyWon = [];
    renderHistory();
  });

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }

  function renderHistory() {
    if (!alreadyWon.length) { historyList.innerHTML = ""; return; }
    historyList.innerHTML = "Already won this round: " +
      alreadyWon.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // A layered, radially-shaded turtle instead of one flat ellipse: a domed
  // shell gradient (light source upper-left) plus a few scute outlines for
  // texture, and four legs that paddle in a real diagonal-gait pattern
  // (front-left + back-right together, then front-right + back-left) —
  // real tortoises and most quadrupeds move that way, not all four at once.
  // Each token gets a phase offset so a big field doesn't paddle in unison.
  function tokenHTML(entrant, color, idx) {
    const gid = `turtleShell${idx}`;
    const phase = ((idx * 0.17) % 1).toFixed(2);
    return `
      <div class="turtle-shadow"></div><div class="dust"></div>
      <div class="turtle3d" style="animation-delay:-${phase}s">
        <svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="${gid}" cx="38%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
              <stop offset="40%" stop-color="${color}" stop-opacity="1"/>
              <stop offset="100%" stop-color="${color}" stop-opacity="0.55"/>
            </radialGradient>
          </defs>
          <ellipse class="t-leg t-leg-br" style="animation-delay:-${phase}s" cx="20" cy="34" rx="5" ry="3" fill="${color}"/>
          <ellipse class="t-leg t-leg-fr" style="animation-delay:-${phase}s" cx="40" cy="34" rx="5" ry="3" fill="${color}"/>
          <ellipse class="t-leg t-leg-bl" style="animation-delay:-${phase}s" cx="16" cy="27" rx="5" ry="3" fill="${color}"/>
          <ellipse class="t-leg t-leg-fl" style="animation-delay:-${phase}s" cx="44" cy="27" rx="5" ry="3" fill="${color}"/>
          <circle cx="50" cy="20" r="7" fill="url(#${gid})"/>
          <circle cx="54" cy="18" r="1.6" fill="#1e2a45"/>
          <circle cx="54.7" cy="17.3" r="0.5" fill="#fff" opacity="0.7"/>
          <ellipse class="t-shell" cx="28" cy="22" rx="22" ry="14" fill="url(#${gid})"/>
          <!-- Scute seams: a handful of arcs, not a full tessellated pattern
               — enough to read as a shell texture without a busy sprite. -->
          <path class="t-scute" d="M14 20 Q20 12 28 12 Q36 12 42 20" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.4"/>
          <path class="t-scute" d="M9 25 L14 20 M47 25 L42 20 M20 33 L20 12 M36 33 L36 12" fill="none" stroke="rgba(0,0,0,0.13)" stroke-width="1.1"/>
          <path class="t-shell-hi" d="M14 15 Q26 8 38 12 Q26 12 14 15 Z" fill="rgba(255,255,255,0.3)"/>
          <path class="t-shell-shade" d="M10 28 Q28 38 46 28 Q28 34 10 28 Z" fill="rgba(0,0,0,0.15)"/>
        </svg>
      </div>`;
  }

  function buildStage(order) {
    if (track) track.destroy(); // cancel any in-flight animations before replacing tokens
    track = SharedTrack.buildField(fieldTokens, leaderboard, order, {
      tokenHTML,
      palette: PALETTE,
      onCross: (entrant, tok) => {
        spawnDust(tok.el);
        const r = tok.el.getBoundingClientRect();
        SuspenseFX.burst(r.left + r.width / 2, r.top + r.height / 2, { count: 10, spread: 0.35 });
      },
    });
  }

  async function runRace() {
    if (racing) return;
    const roster = getNames();
    if (roster.length < 2) {
      statusText.textContent = "Add at least two names first";
      return;
    }
    racing = true;
    winnerBanner.classList.remove("show");
    stage.classList.remove("finished-glow");
    const duration = Number(durationEl.value);
    const result = RaceEngine.run(roster, {
      duration,
      noRepeat: noRepeatEl.checked,
      alreadyWon,
    });

    const byName = Object.fromEntries(result.order.map((o) => [o.name, o]));
    const displayOrder = result.eligiblePool.map((name) => byName[name]);
    buildStage(displayOrder);

    statusText.textContent = "Ready… whenever they feel like it…";
    await SuspenseFX.countdown(stage, ["READY!", "3", "2", "1", "GO! (eventually)"], null, fieldWrap);

    let commentaryIdx = 0;
    statusText.textContent = COMMENTARY[0];
    const commentaryTimer = setInterval(() => {
      commentaryIdx = (commentaryIdx + 1) % COMMENTARY.length;
      statusText.textContent = COMMENTARY[commentaryIdx];
    }, Math.max(1200, duration * 220));

    track.play(); // actual motion is now driven by each token's own Web Animation

    const start = performance.now();
    // Timed to the WINNER's own finish, not the slowest turtle's, so the
    // clock reaches ~0 exactly as the winner crosses the line.
    const winnerTime = displayOrder.find((o) => o.name === result.winner).finishTime;
    const maxTime = winnerTime; // the engine sets this to the slider value (see race-engine.js)
    const slowMo = result.photoFinish;
    const realTotal = maxTime * (slowMo ? RaceEngine.SLOWMO_STRETCH : 1); // real seconds the race takes == the slider value
    let slowMoApplied = false;
    let zoomMildOn = false;
    let lastGroupShake = 0;
    let lastDustCheck = 0;

    // No longer drives position — only reads each token's own animation
    // clock (via track.update) to keep the leaderboard/clock in sync. Real
    // slow motion comes from track.setPlaybackRate(), a genuine browser
    // primitive, not a manual time remap.
    function rankFrame(now) {
      if (!racing) return;
      const rawElapsed = (now - start) / 1000;

      if (slowMo && !slowMoApplied && rawElapsed > maxTime * 0.85) {
        slowMoApplied = true;
        track.setPlaybackRate(0.35);
        clearInterval(commentaryTimer);
        statusText.textContent = "Impossibly close… don't blink…";
      }

      const displayElapsed = slowMoApplied ? SuspenseFX.timeDilation(rawElapsed, maxTime) : rawElapsed;
      clock.textContent = Math.max(0, realTotal - rawElapsed).toFixed(1) + "s"; // real remaining time: hits 0.0 exactly when the winner is decided

      const { groupSurge } = track.update(rawElapsed);

      const overallProgress = displayElapsed / maxTime;
      if (overallProgress > 0.45 && !zoomMildOn) { zoomMildOn = true; track.setZoomMild(true); }
      if (overallProgress > 0.82) track.setZoom(true);
      if (groupSurge && now - lastGroupShake > 900) {
        lastGroupShake = now;
        SuspenseFX.microShake(stage);
      }
      if (now - lastDustCheck > 110) {
        lastDustCheck = now;
        track.tokens.forEach((tok) => { if (tok.el.classList.contains("surging")) spawnDust(tok.el); });
      }

      requestAnimationFrame(rankFrame);
    }
    requestAnimationFrame(rankFrame);

    // End the race the instant the winner's own animation completes —
    // waiting for every turtle (including the slowest) let the winner
    // cross the line while the clock still had time left on it.
    await track.finishedByName(result.winner);
    clearInterval(commentaryTimer);
    finishRace(result);
  }

  function finishRace(result) {
    racing = false;
    if (track) {
      track.setZoom(false);
      track.setZoomMild(false);
      track.celebrateWinner(result.winner);
    }
    SuspenseFX.shake(stage, 350);
    SuspenseFX.winnerSpotlight(stage);
    stage.classList.add("finished-glow");
    setTimeout(() => stage.classList.remove("finished-glow"), 1400);
    statusText.textContent = "We have a winner (finally)";
    clock.textContent = "🏁";
    winnerBanner.classList.remove("show");
    void winnerBanner.offsetWidth;
    winnerBanner.innerHTML = `<span class="wb-eyebrow">🏆 Winner</span><span class="wb-name">🐢 ${escapeHtml(result.winner)} finally crosses the line!</span>`;
    winnerBanner.classList.add("show");
    if (result.photoFinish) SuspenseFX.photoFinishBanner(stage, "Impossibly close finish!");
    if (noRepeatEl.checked) {
      alreadyWon.push(result.winner);
      renderHistory();
    }
    const rect = stage.getBoundingClientRect();
    SuspenseFX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  startBtn.addEventListener("click", runRace);
  buildStage(getNames().map((name) => ({ name, finishTime: 1, progressAt: () => 0 })));
</script>

</body>
</html>
