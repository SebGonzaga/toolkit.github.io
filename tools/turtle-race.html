<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turtle Race Name Picker — Pick &amp; Race</title>
<meta name="description" content="Deliberately, comedically slow — turtles decide who goes first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; padding: 32px 0 64px; align-items: start; }
  .panel {
    border: var(--border); border-radius: var(--radius); background: var(--paper);
    padding: 20px; position: sticky; top: 20px;
  }
  .panel label { display: block; font-weight: 600; font-size: 0.85rem; margin: 16px 0 6px; }
  .panel label:first-of-type { margin-top: 0; }
  textarea {
    width: 100%; min-height: 140px; border: var(--border); border-radius: 8px;
    padding: 10px; font-family: var(--font-body); font-size: 0.9rem; resize: vertical;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  input[type="range"] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 0.88rem; }
  .panel .btn { width: 100%; justify-content: center; margin-top: 18px; }
  .duration-val { font-family: var(--font-display); font-weight: 700; }

  .stage {
    border: var(--border); border-radius: var(--radius);
    background: linear-gradient(180deg, #eee3c8, #ded098);
    padding: 16px;
    min-height: 420px;
  }
  .stage.projector { background: #241d0f; }
  .stage.projector .lane-name { color: #fff; }
  .track { background: #cdbb85 !important; }
  .stage.projector .track { background: #3a2f18 !important; }

  .stage-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .stage-header .status { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
  .stage.projector .stage-header .status { color: #fff; }
  .stage-header .clock { font-family: var(--font-display); font-size: 1.4rem; }
  .stage.projector .stage-header .clock { color: var(--pencil); }

  .track-area { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
  .lane { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin-bottom: 8px; }
  .lane-name { font-size: 0.85rem; font-weight: 600; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 30px; background: #d3e6d9; border-radius: 999px; overflow: hidden; }
  .track .finish-mark { position: absolute; right: 6px; top: 0; bottom: 0; width: 2px; background: rgba(30,42,69,0.4); }
  .duck-token {
    position: absolute; top: 2px; left: 0; width: 26px; height: 26px;
    transition: left 0.08s linear;
  }
  .duck-token svg { width: 100%; height: 100%; animation: wob 1.4s ease-in-out infinite; transform-origin: 50% 80%; }
  @keyframes wob { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }

  .many-names .lane { grid-template-columns: 84px 1fr; }
  .many-names .track { height: 22px; }
  .many-names .duck-token { width: 18px; height: 18px; }

  .winner-banner {
    margin-top: 14px; border: var(--border); border-radius: var(--radius);
    background: var(--pencil-dim); padding: 14px 18px; font-family: var(--font-display);
    font-size: 1.15rem; display: none;
  }
  .winner-banner.show { display: block; }

  .history { margin-top: 16px; font-size: 0.82rem; color: var(--ink-soft); }
  .history .chip { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 0 0; }

  @media (max-width: 860px) {
    .tool-wrap { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
  @media (prefers-reduced-motion: reduce) {
    .duck-token, .duck-token svg { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html"><span class="mark"></span>Pick &amp; Race</a>
    <nav>
      <a href="../index.html#tools">All tools</a>
      <a href="duck-race.html">Duck Race</a>
      <a href="rocket-race.html">Rocket Race</a>
      <a href="balloon-pop.html">Balloon Pop</a>
      <a href="spinning-wheel.html">Wheel</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="margin-top:28px;">Turtle Race Name Picker</h1>
  <p>Same fair pick, delivered as slowly and dramatically as possible. Great for building suspense.</p>

  <div class="tool-wrap">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Ava
Liam
Noor
Diego
Priya
Mateo
Yuki
Isla</textarea>

      <label for="duration">Race length: <span class="duration-val" id="durationVal">8s</span></label>
      <input type="range" id="duration" min="2" max="30" value="8">

      <div class="toggle-row">
        <input type="checkbox" id="noRepeat">
        <label for="noRepeat" style="margin:0;">No repeats until everyone's had a turn</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="projector">
        <label for="projector" style="margin:0;">Projector mode (big/high-contrast)</label>
      </div>

      <button class="btn marker" id="startBtn">Begin the (slow) race</button>
      <button class="btn ghost small" id="resetHistory" style="margin-top:8px; width:100%;">Reset no-repeat history</button>
    </div>

    <div>
      <div class="stage" id="stage">
        <div class="stage-header">
          <span class="status" id="statusText">Ready when you are</span>
          <span class="clock" id="clock">–</span>
        </div>
        <div class="track-area" id="trackArea"></div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</main>

<script src="../assets/js/race-engine.js"></script>
<script>
  const namesEl = document.getElementById("names");
  const durationEl = document.getElementById("duration");
  const durationVal = document.getElementById("durationVal");
  const noRepeatEl = document.getElementById("noRepeat");
  const projectorEl = document.getElementById("projector");
  const startBtn = document.getElementById("startBtn");
  const resetHistoryBtn = document.getElementById("resetHistory");
  const stage = document.getElementById("stage");
  const trackArea = document.getElementById("trackArea");
  const statusText = document.getElementById("statusText");
  const clock = document.getElementById("clock");
  const winnerBanner = document.getElementById("winnerBanner");
  const historyList = document.getElementById("historyList");

  const DUCK_SVG = `<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="28" cy="22" rx="22" ry="14" fill="var(--c,#35604a)"/>
    <path d="M28 10 Q34 2 40 10 Q34 14 28 10 Z" fill="var(--c,#35604a)" opacity="0.85"/>
    <circle cx="50" cy="20" r="7" fill="var(--c,#35604a)"/>
    <circle cx="54" cy="18" r="1.6" fill="#1e2a45"/>
    <ellipse cx="10" cy="30" rx="5" ry="3" fill="var(--c,#35604a)"/>
    <ellipse cx="46" cy="34" rx="5" ry="3" fill="var(--c,#35604a)"/>
  </svg>`;
  const PALETTE = ["#35604a", "#4a7a5e", "#8a6d3b", "#efb93c", "#6b8f71", "#2f4d3a"];

  let alreadyWon = [];
  let racing = false;

  durationEl.addEventListener("input", () => { durationVal.textContent = durationEl.value + "s"; });
  projectorEl.addEventListener("change", () => stage.classList.toggle("projector", projectorEl.checked));
  resetHistoryBtn.addEventListener("click", () => {
    alreadyWon = [];
    renderHistory();
  });

  function getNames() {
    return namesEl.value.split(/[\n,]/).map((s) => s.trim()).filter(Boolean);
  }

  function renderHistory() {
    if (!alreadyWon.length) { historyList.innerHTML = ""; return; }
    historyList.innerHTML = "Already won this round: " +
      alreadyWon.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function buildStage(order) {
    trackArea.innerHTML = "";
    trackArea.parentElement.classList.toggle("many-names", order.length > 14);
    trackArea.classList.toggle("many-names", order.length > 14);
    stage.classList.toggle("many-names", order.length > 14);

    order.forEach((entrant, i) => {
      const lane = document.createElement("div");
      lane.className = "lane";
      const color = PALETTE[i % PALETTE.length];
      lane.innerHTML = `
        <div class="lane-name">${escapeHtml(entrant.name)}</div>
        <div class="track" data-idx="${i}">
          <div class="finish-mark"></div>
          <div class="duck-token" id="duck-${i}" style="--c:${color}">${DUCK_SVG.replace('var(--c,#efb93c)', color)}</div>
        </div>`;
      trackArea.appendChild(lane);
    });
  }

  function runRace() {
    if (racing) return;
    const roster = getNames();
    if (roster.length < 2) {
      statusText.textContent = "Add at least two names first";
      return;
    }
    racing = true;
    winnerBanner.classList.remove("show");
    const duration = Number(durationEl.value);
    const result = RaceEngine.run(roster, {
      duration,
      noRepeat: noRepeatEl.checked,
      alreadyWon,
    });

    // Keep display order stable (roster order) but drive progress by finishTime.
    const byName = Object.fromEntries(result.order.map((o) => [o.name, o.finishTime]));
    const displayOrder = result.eligiblePool.map((name) => ({ name, finishTime: byName[name] }));
    buildStage(displayOrder);

    statusText.textContent = "Plodding along…";
    const start = performance.now();
    const maxTime = Math.max(...displayOrder.map((o) => o.finishTime)) + 0.3;

    function frame(now) {
      const elapsed = (now - start) / 1000;
      clock.textContent = Math.max(0, (duration - elapsed)).toFixed(1) + "s";
      displayOrder.forEach((entrant, i) => {
        const el = document.getElementById(`duck-${i}`);
        if (!el) return;
        const track = el.parentElement;
        const trackW = track.clientWidth - el.clientWidth;
        const progress = Math.min(1, elapsed / entrant.finishTime);
        el.style.left = (progress * trackW) + "px";
      });
      if (elapsed < maxTime) {
        requestAnimationFrame(frame);
      } else {
        finishRace(result.winner);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishRace(winner) {
    racing = false;
    statusText.textContent = "We have a winner";
    clock.textContent = "🏁";
    winnerBanner.textContent = `🐢 ${winner} finally crosses the line!`;
    winnerBanner.classList.add("show");
    if (noRepeatEl.checked) {
      alreadyWon.push(winner);
      renderHistory();
    }
    launchConfetti();
  }

  function launchConfetti() {
    for (let i = 0; i < 24; i++) {
      const c = document.createElement("div");
      const colors = ["#efb93c", "#d9503f", "#35604a", "#1e2a45"];
      c.style.cssText = `position:fixed; top:-10px; left:${Math.random()*100}vw; width:8px; height:8px;
        background:${colors[i % colors.length]}; z-index:999; pointer-events:none;
        transform:rotate(${Math.random()*360}deg);`;
      document.body.appendChild(c);
      const fall = c.animate(
        [{ transform: `translateY(0) rotate(0deg)`, opacity: 1 },
         { transform: `translateY(100vh) rotate(${360 + Math.random()*360}deg)`, opacity: 0 }],
        { duration: 1400 + Math.random() * 900, easing: "ease-in" }
      );
      fall.onfinish = () => c.remove();
    }
  }

  startBtn.addEventListener("click", runRace);
  buildStage(getNames().map((name) => ({ name, finishTime: 1 })));
</script>

</body>
</html>
